name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# One run per branch/PR; cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Typecheck, unit tests, and a from-empty migration + seed against real
  # Postgres 16. Every step is fatal: no `continue-on-error`, no `|| true`.
  # ---------------------------------------------------------------------------
  verify:
    name: typecheck / test / migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: plugsure
          POSTGRES_DB: plugsure
        ports:
          - 5432:5432
        # The job's steps run on the runner host, not in the compose network, so
        # the DB must be reachable on localhost AND be ready before we migrate.
        options: >-
          --health-cmd "pg_isready -U postgres -d plugsure"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:plugsure@127.0.0.1:5432/plugsure
      NODE_ENV: test
      LOG_LEVEL: warn
      TZ: Asia/Jakarta

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Caches ~/.npm keyed on package-lock.json.
          cache: npm

      # `npm ci` — not `npm install` — so CI installs exactly the locked tree and
      # a drifting lockfile is a build failure rather than a silent version bump.
      #
      # KNOWN BLOCKER (2026-08): this step currently fails on main. package.json
      # and package-lock.json are out of sync, and one declared range is
      # unsatisfiable — @types/ws@^8.19.0 does not exist (latest published is
      # 8.18.1), so even resolution fails with ETARGET. Fix once, in a dedicated
      # commit, then this pipeline goes green:
      #     npm pkg set devDependencies.@types/ws=^8.18.1
      #     rm -rf node_modules package-lock.json && npm install
      #     git add package.json package-lock.json
      # Do NOT "fix" it by switching this step to `npm install`.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `npm test` is `tsx --test src/**/*.test.ts`. That glob is expanded by the
      # shell, and bash without `globstar` does not recurse `**`, so it would run
      # zero tests and exit 0 — a green build that tested nothing. Expand the file
      # list explicitly and fail if the list is empty.
      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(src/**/*.test.ts)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no test files matched src/**/*.test.ts"
            exit 1
          fi
          printf 'running %d test file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          npx tsx --test "${files[@]}"

      # Proves the schema applies cleanly from an EMPTY database — the thing that
      # breaks silently when someone edits an already-applied migration in place.
      - name: Migrate from empty
        run: npm run migrate

      # Idempotency: the migrator tracks applied files in schema_migration, so a
      # second run must be a no-op rather than an error.
      - name: Migrate again (idempotency)
        run: npm run migrate

      - name: Seed
        run: npm run seed

      - name: Assert schema is recorded
        run: |
          set -euo pipefail
          count=$(psql "$DATABASE_URL" -tAc "select count(*) from schema_migration")
          echo "applied migrations: $count"
          test "$count" -ge 1

      - name: Build (tsc -p tsconfig.build.json)
        run: npm run build

      - name: Assert build output is runnable
        run: |
          set -euo pipefail
          test -f dist/apps/gateway.js
          test -f dist/apps/api.js
          test -f dist/db/migrate.js
          # The Dockerfile copies src/web -> dist/web; tsc does not. Guard the
          # layout assumption that src/api/server.ts makes: join(here, '../web').
          test -f src/web/index.html
          node --check dist/apps/gateway.js
          node --check dist/apps/api.js

  # ---------------------------------------------------------------------------
  # Build the production image and smoke-test BOTH roles out of it: the compiled
  # migrator against a real Postgres, then the API serving /healthz and the
  # operator console HTML. This is what catches a broken dist/web copy or a
  # missing db/migrations path before a vendor integration day does.
  # ---------------------------------------------------------------------------
  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: plugsure
          POSTGRES_DB: plugsure
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d plugsure"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t plugsure:ci .

      - name: Image runs as non-root
        run: |
          set -euo pipefail
          uid=$(docker run --rm plugsure:ci node -e "process.stdout.write(String(process.getuid()))")
          echo "runtime uid: $uid"
          test "$uid" != "0"

      - name: Migrate from the image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://postgres:plugsure@127.0.0.1:5432/plugsure \
            plugsure:ci node dist/db/migrate.js

      - name: Seed from the image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://postgres:plugsure@127.0.0.1:5432/plugsure \
            plugsure:ci node dist/db/seed.js

      - name: API serves /healthz and the operator console
        run: |
          set -euo pipefail
          docker run -d --name plugsure-api --network host \
            -e DATABASE_URL=postgresql://postgres:plugsure@127.0.0.1:5432/plugsure \
            -e API_PORT=9200 -e API_HOST=0.0.0.0 \
            plugsure:ci node dist/apps/api.js
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9200/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9200/healthz | tee /dev/stderr | grep -q '"ok":true'
          # The console is static HTML served from dist/web. If the Dockerfile
          # stops copying it, this is where we find out.
          curl -fsS http://127.0.0.1:9200/ | grep -q "PlugSure Operator Console"
          docker rm -f plugsure-api

      - name: Gateway accepts connections and answers the healthcheck
        run: |
          set -euo pipefail
          docker run -d --name plugsure-gw --network host \
            -e DATABASE_URL=postgresql://postgres:plugsure@127.0.0.1:5432/plugsure \
            -e OCPP_PORT=9220 \
            -e HEALTHCHECK_URL=http://127.0.0.1:9220/ \
            -e HEALTHCHECK_OK_STATUS=426 \
            plugsure:ci node dist/apps/gateway.js
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9220/ || true)
            [ "$code" = "426" ] && break
            sleep 1
          done
          # 426 Upgrade Required is the gateway's healthy answer to a plain GET.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9220/)" = "426"
          docker logs plugsure-gw
          docker rm -f plugsure-gw

  # ---------------------------------------------------------------------------
  # Cheap linting of the deployment artefacts themselves.
  # ---------------------------------------------------------------------------
  deploy-artefacts:
    name: deploy artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Validate systemd units
        run: |
          set -euo pipefail
          systemd-analyze verify \
            deploy/plugsure-gateway.service \
            deploy/plugsure-api.service 2>&1 | tee /tmp/units.log
          # systemd-analyze warns about paths that do not exist on the runner
          # (/opt/plugsure, /etc/plugsure/plugsure.env). Only fail on real syntax
          # errors: unknown directives and bad assignments.
          ! grep -Ei "Unknown (lvalue|section)|Failed to parse|Invalid " /tmp/units.log

      - name: Validate Caddyfile
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
