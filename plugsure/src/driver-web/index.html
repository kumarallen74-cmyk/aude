  wait.innerHTML=`<div class="center-loading" style="padding:20px;gap:12px;flex-direction:column">

    catch(e){ alertBanner(e.message); $('#paid').textContent='Simulasikan pembayaran (demo)'; }
  };
  // Auto-poll: once captured, proceed.
  const check=async()=>{

      if(s.state!=='awaiting_payment' && state.view==='pay'){ onPaid(co); } }catch(e){}
  };
  state.poll=setInterval(check,2500);

  // rather than waiting out a timer the phone throttled in the background.
  const onVisible=()=>{ if(document.visibilityState==='visible' && state.view==='pay') check(); };
  document.addEventListener('visibilitychange',onVisible);
  const stopWatching=()=>{ if(state.view!=='pay'){ document.removeEventListener('visibilitychange',onVisible); window.removeEventListener('hashchange',stopWatching); } };
  window.addEventListener('hashchange',stopWatching);
};

/**
 * "Simpan QR": compose the QRIS code with the amount, station and expiry into one
 * PNG, then hand it to the phone. The share sheet is preferred (on iOS it offers
 * "Save Image" into Photos, which a plain download does not); otherwise it is a
 * normal file download. Returns 'shared' | 'downloaded', or null if the driver
 * dismissed the share sheet.
 */
async function saveQrImage(co,label){
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=co.qr.qrPng||co.qr.qrImage; });
  // The QR keeps the standard 4-module white quiet zone on every side (text
  // included), so strict bank-app decoders read it. The server PNG has no margin
  // and 12 px per module, which gives the module count.
  const W=720, Q=520, mod=Q/Math.max(21,Math.round(img.naturalWidth/12)), quiet=Math.ceil(4*mod);
  const qrTop=78+Math.max(72,quiet), qrBottom=qrTop+Q, amtBase=qrBottom+Math.max(72,quiet)+40;
  const H=amtBase+190;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g=cv.getContext('2d');
  g.fillStyle='#ffffff'; g.fillRect(0,0,W,H);
  g.fillStyle='#0c1a1d'; g.textAlign='center';
  g.font='700 30px "Plus Jakarta Sans", system-ui, sans-serif';
  g.fillText('QRIS · PlugSure',W/2,64);
  g.imageSmoothingEnabled=false;
  g.drawImage(img,(W-Q)/2,qrTop,Q,Q);
  g.font='800 52px "Sora", system-ui, sans-serif';
  g.fillText(rp(co.qr.amountIdr),W/2,amtBase);
  g.fillStyle='#5f7773'; g.font='600 24px "Plus Jakarta Sans", system-ui, sans-serif';
  // The line under the amount: what is being paid (a pass, an unpaid session), or the charging station.
  const station=label||(state._con&&state._con.station&&state._con.station.name)||'';
  if(station) g.fillText(station.length>44?station.slice(0,43)+'…':station,W/2,amtBase+48);
  const exp=co.qr.expiresAt?new Date(co.qr.expiresAt).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'';
  g.fillText((exp?'Berlaku s.d. '+exp+' · ':'')+'Ref '+String(co.qr.providerRef||'').slice(-10),W/2,amtBase+88);
  g.font='500 20px "Plus Jakarta Sans", system-ui, sans-serif';
  g.fillText('Bayar lewat aplikasi bank / e-wallet: Scan QR → pilih dari galeri',W/2,amtBase+146);
  const blob=await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('toBlob')),'image/png'));
  const name='QRIS-PlugSure-'+co.qr.amountIdr+'.png';
  const file=new File([blob],name,{type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:'QRIS PlugSure'}); return 'shared'; }
    catch(e){ if(e&&e.name==='AbortError') return null; /* share failed → fall through to download */ }
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
  return 'downloaded';
}
async function onPaid(co){
  if(state.poll){clearInterval(state.poll);state.poll=null;}
  haptic();
  try{ const s=await api('/v1/charge/'+co.chargeId+'/start',{method:'POST'});
    go('session',{chargeId:co.chargeId,_back:()=>go('home'),justStarted:s});
  }catch(e){ alertBanner(e.message); go('session',{chargeId:co.chargeId,_back:()=>go('home')}); }
}

//──────────── LIVE SESSION
// The cost so far, priced as the receipt will be: what it includes, what was saved, and an idle fee rising.
function costNote(s){
  const c=s.cost; if(!c||!['charging','finishing','ended','rated'].includes(s.state))return '';
  const bits=[];
  if(s.mode==='prepaid'&&s.amountIdr) bits.push(`<span>Biaya sejauh ini ${rp(c.totalIdr)} dari ${rp(s.amountIdr)} dibayar</span>`);
  if(c.taxIdr>0) bits.push(`<span>Termasuk pajak ${rp(c.taxIdr)}</span>`);
  if(c.discountIdr>0) bits.push(`<span class="save">Hemat ${rp(c.discountIdr)}</span>`);
  const idle=c.idleFeeIdr>0&&s.state==='charging'
    ?`<div class="idle">${svg(I.info,'')}<span>Biaya parkir ${rp(c.idleFeeIdr)}: mobil tidak mengisi selama ${c.idleMinutes} menit. Cabut untuk menghentikannya.</span></div>`:'';
  return bits.length||idle?`<div class="costnote">${bits.length?`<div class="bits">${bits.join('<i>·</i>')}</div>`:''}${idle}</div>`:'';
}
VIEWS.session=async(v)=>{
  v.className='view full';
  const id=state.params.chargeId;
  v.innerHTML=topbar('Sesi pengisian','',{back:1})+`<div id="live"><div class="center-loading"><span class="spinner"></span></div></div>`;
  const paint=(s)=>{
    const live=$('#live'); if(!live)return;
    const isPrepaid=s.mode==='prepaid';
    const pct=isPrepaid?(s.progressPct||0):null;
    const R=104, C=2*Math.PI*R, off=pct!=null?C*(1-pct/100):C*0.0001;
    const stateLabel={awaiting_payment:'Menunggu pembayaran',awaiting_start:'Menunggu charger…',charging:'Sedang mengisi',finishing:'Menyelesaikan…',ended:'Selesai',rated:'Selesai',refund_pending:'Dana sedang dikembalikan',refunded:'Dana dikembalikan',released:'Penahanan dilepas',unknown:'Memeriksa…'}[s.state]||s.state;
    const active=s.state==='charging';
    live.innerHTML=`
      <div class="live">
        <div class="ring-wrap">
          <svg viewBox="0 0 240 240" style="transform:rotate(-90deg)">
            <circle cx="120" cy="120" r="${R}" fill="none" stroke="var(--line-2)" stroke-width="14"/>
            <circle cx="120" cy="120" r="${R}" fill="none" stroke="var(--arus)" stroke-width="14" stroke-linecap="round"
              stroke-dasharray="${C}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .8s ease"/>
          </svg>
          <div class="ring-center">
            <div class="kwh">${kwh(s.energyKwh)}<small> kWh</small></div>
            <div class="st">${active?'<span class="pulse"></span>':''}${esc(stateLabel)}</div>
          </div>
        </div>
        <div class="livestats">
          <div class="lstat"><div class="v">${s.powerKw!=null?kwh(s.powerKw):'—'}</div><div class="k">kW saat ini</div></div>
          <div class="lstat"><div class="v">${s.durationMin}</div><div class="k">menit</div></div>
          ${isPrepaid?`<div class="lstat"><div class="v">${pct!=null?pct+'%':'—'}</div><div class="k">saldo</div></div>`
            :`<div class="lstat"><div class="v" style="font-size:15px">${s.estimatedIdr!=null?rp(s.estimatedIdr):'—'}</div><div class="k">${s.cost&&s.cost.final?'Total':'biaya sejauh ini'}</div></div>`}
        </div>
        ${costNote(s)}
        <div class="card soft small" style="margin-top:14px;display:flex;justify-content:space-between">
          <span class="muted">${esc(s.siteName)}</span><span>${esc(s.connectorLabel)}</span>
        </div>
        <div id="v2xbox"></div>
        <div id="sessact" style="margin-top:16px"></div>
      </div>`;
    if(s.v2x) paintV2x($('#v2xbox'),s,id,()=>tickSession(id,paint));
    const act=$('#sessact');
    if(s.state==='released'){
      // A card hold that was never used: nothing was taken.
      act.innerHTML=`<div class="refund">${svg(I.card)}<div><div class="t">Penahanan kartu dilepas</div><div class="s">Pengisian tidak dimulai, jadi tidak ada dana yang ditarik dari kartu Anda.</div></div></div>
        <button class="cta ghost" id="home" style="margin-top:12px">Kembali ke beranda</button>`;
      $('#home').onclick=()=>go('home');
      if(state.poll){clearInterval(state.poll);state.poll=null;}
    } else if(s.state==='refund_pending'||s.state==='refunded'){
      // Paid, but the charge never started: the payment is being / has been returned.
      const rf=s.refund||{};
      act.innerHTML=`<div class="refund">${svg(I.gift)}<div>
          <div class="t">${s.state==='refunded'?'Dana dikembalikan':'Pengembalian dana diproses'} ${rp(rf.amountIdr||0)}</div>
          <div class="s">${s.state==='refunded'
            ?`Dikembalikan${rf.refundedAt?' '+new Date(rf.refundedAt).toLocaleDateString('id-ID',{day:'numeric',month:'short'}):''} ke metode pembayaran Anda.`
            :'Pengisian tidak dimulai, jadi pembayaran Anda dikembalikan penuh.'}</div></div></div>
        <button class="cta ghost" id="home" style="margin-top:12px">Kembali ke beranda</button>`;
      $('#home').onclick=()=>go('home');
      if(state.poll){clearInterval(state.poll);state.poll=null;}
    } else if(s.state==='rated'||s.state==='ended'||s.state==='finishing'){
      act.innerHTML=`<button class="cta" id="receipt">${svg(I.check)} Lihat struk</button>`;
      $('#receipt').onclick=()=>go('receipt',{chargeId:id,_back:()=>go('home')});
      if(state.poll){clearInterval(state.poll);state.poll=null;}
      // Unpaid (an expired card hold, or a post-pay charge that failed): say so, and lead to paying.
      if(s.state==='rated') api('/v1/charge/'+id+'/pay-unpaid').then((u)=>{ if(u&&!u.paid&&state.view==='session'&&act.isConnected){
        act.innerHTML=`<div class="banner b-warn" style="margin-bottom:10px">${svg(I.info)}<div><b>Belum terbayar: ${rp(u.owedIdr)}</b><div>Bayar sesi ini dari struk.</div></div></div><button class="cta" id="receipt">Bayar · lihat struk</button>`;
        $('#receipt').onclick=()=>go('receipt',{chargeId:id,_back:()=>go('home')}); } }).catch(()=>{});
    } else if(s.state==='awaiting_start'){
      const tok=state.params.justStarted&&state.params.justStarted.presentToken;
      act.innerHTML=(tok?`<div class="banner b-info">${svg(I.info)}<div>Tempelkan kartu atau tekan tombol di charger. Kode: <b>${esc(tok)}</b></div></div>`:'')+
        `<button class="cta ghost" id="cancel">Batalkan</button>`;
      $('#cancel').onclick=()=>go('home');
    } else {
      act.innerHTML=`<button class="cta danger" id="stop">${svg(I.stop)} Hentikan pengisian</button>`;
      $('#stop').onclick=async()=>{ if(!confirm(window.tstr('Hentikan pengisian sekarang?')))return;
        $('#stop').innerHTML='<span class="spinner"></span>';
        try{ await api('/v1/charge/'+id+'/stop',{method:'POST'}); tickSession(id,paint); }
        catch(e){ alertBanner(e.message); paint(s); }
      };
      startLiveActivity(s);
      // "Stop charging" pressed on the notification: the same question as the button.
      if(window.PENDING_ACTION==='stop'){ window.PENDING_ACTION=null; setTimeout(()=>{ const b=$('#stop'); if(b) b.click(); },250); }
    }
  };
  const first=await tickSession(id,paint);
  state.poll=setInterval(()=>tickSession(id,paint).catch(()=>{}),4000);
  if(['awaiting_start','charging'].includes(first.state)){ $('#live').insertAdjacentHTML('afterend','<div id="pushoffer"></div>'); offerPush($('#pushoffer')); }
};
async function tickSession(id,paint){ const s=await api('/v1/charge/'+id+'/status'); paint(s); return s; }

// Bidirectional charging (V2G / V2B): the car gives energy back while the site's load peaks, if the driver agrees.
const V2X_WHY={
  'outside the discharge hours':'Di luar jam pengembalian energi','the driver leaves within the hour':'Kurang dari satu jam sebelum Anda pergi',
  'battery level unknown':'Level baterai belum diketahui','the charger does not speak OCPP 2.1':'Charger ini belum mendukung',
  'the car did not offer to discharge':'Mobil tidak menawarkan pengembalian energi',
};
function v2xWhy(r){
  if(!r) return 'Menunggu giliran';
  const m=/^battery at or below (\d+)%$/.exec(r); if(m) return 'Baterai sudah di batas '+m[1]+'%';
  if(/building load|discharge limit|share of the site/.test(r)) return 'Lokasi sedang tidak membutuhkan energi';
  return V2X_WHY[r]||'Menunggu giliran';
}
function paintV2x(box,s,id,refresh){
  const x=s.v2x; if(!box||!x) return;
  const active=s.state==='charging';
  const given=x.exportKwh>0?`<div class="small" style="margin-top:6px">Dikembalikan ${kwh(x.exportKwh)} kWh · kredit ${rp(x.creditIdr||0)}</div>`:'';
  if(!x.consent){
    if(!active||!x.canOffer){ box.innerHTML=given?`<div class="card soft" style="margin-top:12px">${given}</div>`:''; return; }
    const floors=[]; for(let p=Math.ceil((x.siteMinSocPercent||40)/5)*5;p<=90;p+=5) floors.push(p);
    const pick=state.v2xFloor&&floors.includes(state.v2xFloor)?state.v2xFloor:floors[0];
    box.innerHTML=`<div class="card" style="margin-top:12px">
        <div style="font-weight:700">Kembalikan energi ke lokasi (V2G)</div>
        <div class="small muted" style="margin-top:4px">Mobil Anda bisa mengembalikan listrik saat beban puncak lokasi.</div>
        <div class="small" style="margin-top:6px">Kredit ${rp(x.creditIdrPerKwh||0)} per kWh. Baterai tidak turun di bawah ${pick}%, dan tidak dalam satu jam sebelum Anda pergi.</div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:10px">
          <label class="small muted" for="v2xfloor">Batas baterai</label>
          <select id="v2xfloor">${floors.map((p)=>`<option value="${p}"${p===pick?' selected':''}>${p}%</option>`).join('')}</select>
          <button class="cta" id="v2xon" style="margin:0 0 0 auto;width:auto;padding:10px 18px">Izinkan</button>
        </div>${given}</div>`;
    $('#v2xfloor').onchange=(e)=>{ state.v2xFloor=Number(e.target.value); refresh(); };
    $('#v2xon').onclick=async()=>{ $('#v2xon').innerHTML='<span class="spinner"></span>';
      try{ await api('/v1/charge/'+id+'/v2x',{method:'POST',body:JSON.stringify({enabled:true,minSocPercent:pick})}); haptic(); refresh(); }
      catch(e){ alertBanner(e.message); refresh(); } };
    return;
  }
  box.innerHTML=`<div class="card" style="margin-top:12px">
      <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:700">Kembalikan energi ke lokasi (V2G)</div><span class="small">Diizinkan</span></div>
      <div class="small" style="margin-top:6px">${x.discharging?'Sedang mengembalikan '+kwh(x.dischargeKw||0)+' kW':esc(v2xWhy(x.notDischargingBecause))}</div>
      ${given}
      ${active?(x.consentSource==='fleet'?'<div class="small muted" style="margin-top:6px">Diatur oleh armada Anda.</div>'
        :'<button class="cta ghost" id="v2xoff" style="margin-top:10px">Matikan</button>'):''}</div>`;
  const off=$('#v2xoff'); if(off) off.onclick=async()=>{ off.innerHTML='<span class="spinner"></span>';
    try{ await api('/v1/charge/'+id+'/v2x',{method:'POST',body:JSON.stringify({enabled:false})}); refresh(); }
    catch(e){ alertBanner(e.message); refresh(); } };
}

VIEWS.receipt=async(v)=>{

    <div class="a">${l.amountIdr<0?'−':''}${rp(Math.abs(l.amountIdr))}</div></div>`).join('');

        ${r.station.operatorNpwp?`<div class="rc-line small muted"><span>NPWP</span><span class="a" style="font-weight:500">${esc(r.station.operatorNpwp)}${r.station.operatorPkp?' · PKP':''}</span></div>`:''}
        ${r.receiptNo?`<div class="rc-line small muted"><span>No.</span><span class="a" style="font-weight:500">${esc(r.receiptNo)}</span></div>`:''}
        <div class="rc-sep"></div>
        ${lines}
        ${t?`<div class="rc-sep"></div>
          <div class="rc-line"><span class="d">Subtotal</span><span class="a">${rp(t.subtotalIdr)}</span></div>
          <div class="rc-line"><span class="d">PBJT-TL ${(t.pbjtRateBps/100)}%</span><span class="a">${rp(t.pbjtIdr)}</span></div>
          ${t.ppnIdr>0?`<div class="rc-line"><span class="d">DPP <span class="q">(${esc(t.dppFraction||'11/12')} × harga)</span></span><span class="a">${rp(t.ppnDppIdr)}</span></div>
          <div class="rc-line"><span class="d">PPN ${(t.ppnRateBps/100)}% × DPP <span class="q">(efektif ${(t.ppnEffectiveRateBps/100)}%)</span></span><span class="a">${rp(t.ppnIdr)}</span></div>`
          :`<div class="rc-line small muted"><span class="d">PPN</span><span class="a">Tidak dikenakan</span></div>`}
          <div class="rc-sep"></div>
          <div class="rc-line tot"><span class="d">Total</span><span class="a">${rp(t.totalIdr)}</span></div>
          ${r.loyalty&&r.loyalty.earnedPoints?`<div class="rc-line small muted"><span class="d">Poin diperoleh</span><span class="a">+${r.loyalty.earnedPoints.toLocaleString('id-ID')} poin</span></div>`:''}
          ${r.signedData&&r.signedData.status?`<div class="rc-line small muted"><span class="d">Meter bertanda tangan</span><span class="a">${esc(({verified:'Terverifikasi',unverified_key:'Cocok',mismatch:'Tidak cocok',invalid:'Tidak sah',incomplete:'Tidak lengkap',missing:'Tidak ada'})[r.signedData.status]||r.signedData.status)}</span></div>`:''}`
          :`<div class="banner b-info" style="margin-top:8px">${svg(I.clock)}<div>Struk sedang diproses. Coba lagi sebentar.</div></div>`}
      </div>
      ${set&&set.postpay&&set.postpay.paidInApp?`<div class="refund">${svg(I.check)}<div><div class="t">Dibayar di aplikasi: ${rp(set.postpay.paidInApp.amountIdr)}</div><div class="s">${set.postpay.paidInApp.reason==='link_ended'?'Tautan e-wallet Anda sudah tidak aktif saat penagihan':set.postpay.paidInApp.reason==='pin_not_confirmed'?'Anda memilih metode lain daripada konfirmasi PIN e-wallet':set.postpay.paidInApp.reason==='pin_expired'?'Konfirmasi PIN e-wallet Anda kedaluwarsa':set.postpay.paidInApp.reason==='pin_denied'?'Konfirmasi PIN e-wallet Anda ditolak':set.postpay.paidInApp.reason==='pin_cancelled'?'Anda membatalkan konfirmasi PIN e-wallet':'Penagihan ke e-wallet Anda tidak berhasil'}; Anda sudah membayar sesi ini di aplikasi${set.postpay.paidInApp.channel?' ('+esc((METHOD_UI[set.postpay.paidInApp.channel]||[set.postpay.paidInApp.channel])[0])+')':''}. Terima kasih.</div></div></div>`:set&&set.postpay?`<div class="refund">${svg(I.wallet)}<div><div class="t">${set.postpay.unpaid?'Belum terbayar: ':'Dibayar setelah selesai: '}${rp(set.postpay.chargedIdr)}</div><div class="s">${set.postpay.unpaid?(set.postpay.checkoutUrl?'Konfirmasi pembayaran di aplikasi '+esc((METHOD_UI[set.postpay.channel]||['e-wallet'])[0])+(set.postpay.payOptions?', atau bayar dengan metode lain.':'.'):set.postpay.linkEnded?'Tautan '+esc((METHOD_UI[set.postpay.channel]||['e-wallet'])[0])+' Anda sudah tidak aktif, jadi belum ada yang ditagih. Bayar sesi ini sekarang dengan metode lain.':set.postpay.pinCancelled?'Konfirmasi PIN '+esc((METHOD_UI[set.postpay.channel]||['e-wallet'])[0])+' dibatalkan, jadi belum ada yang ditagih. Konfirmasi lagi, atau bayar dengan metode lain.':set.postpay.pinDenied?'Konfirmasi PIN '+esc((METHOD_UI[set.postpay.channel]||['e-wallet'])[0])+' ditolak, jadi belum ada yang ditagih. Coba konfirmasi lagi, atau bayar dengan metode lain.':set.postpay.pinExpired?'Konfirmasi PIN '+esc((METHOD_UI[set.postpay.channel]||['e-wallet'])[0])+' sudah kedaluwarsa, jadi belum ada yang ditagih. Konfirmasi ulang sekarang, atau bayar dengan metode lain.':set.postpay.insufficient?'Saldo '+esc((METHOD_UI[set.postpay.channel]||['e-wallet'])[0])+' Anda tidak cukup untuk tagihan ini. Isi saldo lalu bayar sekarang, atau bayar dengan metode lain.':set.postpay.payOptions?'Penagihan ke '+esc((METHOD_UI[set.postpay.channel]||['e-wallet'])[0])+' belum berhasil. Coba bayar sekarang, atau bayar dengan metode lain.':'Penagihan ke '+esc((METHOD_UI[set.postpay.channel]||['e-wallet'])[0])+' belum berhasil. Periksa saldo, lalu bayar sekarang.'):'Ditagih dari '+esc((METHOD_UI[set.postpay.channel]||['e-wallet'])[0])+' Anda sesuai pemakaian (batas '+rp(set.postpay.limitIdr)+').'}</div></div></div>${set.postpay.linkEnded?'<div id="payunpaidbox"></div><button class="cta" id="payunpaid" style="margin-top:10px">Bayar sekarang · '+rp(set.postpay.chargedIdr)+'</button>':set.postpay.unpaid&&set.postpay.payOptions?'<button class="cta" id="paynow" style="margin-top:10px">'+(set.postpay.checkoutUrl?'Konfirmasi di ':set.postpay.pinExpired||set.postpay.pinDenied||set.postpay.pinCancelled?'Konfirmasi ulang di ':'Bayar sekarang dengan ')+esc((METHOD_UI[set.postpay.channel]||['e-wallet'])[0])+'</button><div id="payunpaidbox"></div><button class="cta ghost" id="payunpaid" style="margin-top:10px">Bayar dengan metode lain · '+rp(set.postpay.chargedIdr)+'</button>':set.postpay.unpaid?'<button class="cta" id="paynow" style="margin-top:10px">Bayar sekarang</button>':''}`:''}
      ${set&&set.hold&&set.hold.paidInApp?`<div class="refund">${svg(I.check)}<div><div class="t">Dibayar di aplikasi: ${rp(set.hold.paidInApp.amountIdr)}</div><div class="s">Penahanan kartu Anda berakhir sebelum biaya ditagih; Anda sudah membayar sesi ini di aplikasi${set.hold.paidInApp.channel?' ('+esc((METHOD_UI[set.hold.paidInApp.channel]||[set.hold.paidInApp.channel])[0])+')':''}. Terima kasih.</div></div></div>`:set&&set.hold&&set.hold.expired?`<div class="refund">${svg(I.card)}<div><div class="t">Tidak ditagih dari kartu Anda</div><div class="s">Penahanan ${rp(set.hold.heldIdr)} di kartu Anda berakhir di bank sebelum biaya pengisian ${rp(set.hold.unpaidIdr||0)} ditagih, jadi tidak ada yang diambil dan dana yang ditahan sudah kembali. Bayar sesi ini sekarang di aplikasi.</div></div></div><div id="payunpaidbox"></div><button class="cta" id="payunpaid" style="margin-top:10px">Bayar sekarang · ${rp(set.hold.unpaidIdr||0)}</button>`:set&&set.hold?`<div class="refund">${svg(I.card)}<div><div class="t">Ditagih ${rp(set.hold.chargedIdr)} dari kartu Anda</div><div class="s">Ditahan ${rp(set.hold.heldIdr)}; ${rp(set.hold.releasedIdr)} dilepas${set.hold.state==='captured'?'.':' (sedang diproses).'}${set.topUpIdr>0?' '+rp(set.topUpIdr)+' di atas batas penahanan tidak ditagih.':''}</div></div></div>`:''}
      ${set&&set.refundIdr>0?`<div class="refund">${svg(I.gift)}<div><div class="t">Pengembalian ${rp(set.refundIdr)}</div><div class="s">Dari ${rp(set.paidIdr)} dibayar, ${rp(set.usedIdr)} terpakai. ${set.refund&&set.refund.state==='refunded'?'Sudah dikembalikan.':'Sedang diproses.'}</div></div></div>`:''}

    if(set.postpay.checkoutUrl){ location.href=set.postpay.checkoutUrl; return; }
    try{ const r=await api('/v1/charge/'+id+'/pay-now',{method:'POST'});
      if(r.checkoutUrl){ location.href=r.checkoutUrl; return; }
      haptic(); alertBanner('Pembayaran berhasil.'); go('receipt',{...state.params}); }
    catch(e){ alertBanner(e.message); b.disabled=false; b.textContent='Bayar sekarang'; } };
  // An unpaid session (a card hold that expired, or post-pay whose e-wallet link ended): pay what it cost now,
  // with any method the operator offers.
  if($('#payunpaid')){ let pick=null; const due=set.hold&&set.hold.expired?{owed:set.hold.unpaidIdr||0,po:set.hold.payOptions||{}}:{owed:set.postpay.chargedIdr||0,po:set.postpay.payOptions||{}};
    const owed=due.owed, po=due.po;
    $('#payunpaid').onclick=async()=>{ const b=$('#payunpaid');
      const list=po.paymentMethods||[], saved=(list.some((m)=>m.channel==='CARD')?(po.savedCards||[]):[]).concat(po.linkedWallets||[]);
      // More than one way to pay: choose first.
      if(!pick&&list.length+saved.length>1){ pick=methodPicker($('#payunpaidbox'),list,{savedCards:po.savedCards,linkedWallets:po.linkedWallets,settle:true,avoid:set.hold&&set.hold.expired?null:set.postpay.channel}); b.textContent='Bayar '+rp(owed); return; }
      b.disabled=true; b.innerHTML='<span class="spinner"></span>';
      try{ const r=await api('/v1/charge/'+id+'/pay-unpaid',{method:'POST',body:JSON.stringify(pick?pick.value():(list[0]?{method:list[0].channel}:{}))});
        if(r.paid){ haptic(); alertBanner('Pembayaran berhasil. Terima kasih.'); return go('receipt',{...state.params}); }
        state._spay={...r,chargeId:id}; rememberCheckout('spay',state._spay); go('spay',{_back:()=>go('receipt',{chargeId:id,_back:()=>go('home')})}); }
      catch(e){ alertBanner(e.message); b.disabled=false; b.textContent='Bayar '+rp(owed);
        if(e.body&&(e.body.code==='wallet_link_ended'||e.body.code==='saved_card_ended')) go('receipt',{...state.params}); } };
  }
  const td=$('#taxdoc');
  if(td) td.onclick=async()=>{
    // The device token travels in a header, so fetch the document and open it locally.
    const w=window.open('','_blank');
    try{
      const res=await fetch('/d/v1/charge/'+id+'/receipt.html',{headers:{Authorization:'Bearer '+DEVICE,...(window.BRAND?{'X-Driver-Brand':window.BRAND.slug}:{})}});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const url=URL.createObjectURL(new Blob([await res.text()],{type:'text/html'}));
      if(w) w.location.href=url; else location.href=url;
    }catch(e){ if(w) w.close(); alertBanner('Gagal memuat.'); }
  };
};

//──────────── HISTORY
VIEWS.history=async(v)=>{
  v.className='view';
  v.innerHTML=topbar('Riwayat','Pengisian Anda',{theme:1})+`<div id="hist"><div class="skel" style="height:70px;margin-bottom:9px"></div><div class="skel" style="height:70px"></div></div>`;
  const {charges}=await api('/v1/history');
  const box=$('#hist');
  if(!charges.length){ box.innerHTML=`<div class="center-empty">${svg(I.clock)}<div>Belum ada pengisian.</div><div class="small" style="margin-top:8px">Pindai charger untuk mulai.</div></div>`; return; }
  const stLabel={rated:'Selesai',ended:'Selesai',active:'Berlangsung',settled:'Selesai',no_session:'Belum dimulai',refund_pending:'Dana sedang dikembalikan',refunded:'Dana dikembalikan',starting:'Menghubungkan'};
  box.innerHTML=charges.map((c,i)=>{
    const d=c.createdAt?new Date(c.createdAt):null;
    const when=d?d.toLocaleDateString('id-ID',{day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'';
    return `<button class="hrow" data-hi="${i}">
      <div class="ic">${svg(c.kind==='roaming'?I.globe:c.mode==='fleet'?I.fleet:I.bolt)}</div>
      <div style="flex:1;min-width:0"><div class="nm">${esc(c.siteName||'Pengisian')}</div>
        <div class="mt">${when} · ${stLabel[c.state]||c.state}${c.kind==='roaming'?' · Mitra':c.mode==='fleet'?' · Armada':''}</div></div>
      <div class="rt">${c.totalIdr!=null?`<div class="a">${rp(c.totalIdr)}</div>`:''}${c.energyKwh!=null?`<div class="e">${kwh(c.energyKwh)} kWh</div>`:''}</div>
    </button>`;}).join('');
  box.querySelectorAll('[data-hi]').forEach(b=>b.onclick=()=>{
    const c=charges[Number(b.dataset.hi)];
    if(c&&c.kind==='roaming'){ return c.cdrId&&c.state==='rated'?go('rreceipt',{cdrId:c.cdrId,_back:()=>go('history')}):go('rsession',{chargeId:c.chargeId,_back:()=>go('history')}); }
    // A charge that never started has no receipt; its page shows the refund instead.
    if(c&&(c.state==='active'||c.state==='ended'||c.state==='refund_pending'||c.state==='refunded'||c.state==='no_session')) go('session',{chargeId:c.chargeId,_back:()=>go('history')});
    else go('receipt',{chargeId:c.chargeId,_back:()=>go('history')});
  });
};

  const lrow=el('<div></div>'); body.appendChild(lrow); paintLoyalty(lrow);
  const crow=el('<div></div>'); body.appendChild(crow); paintCards(crow);
  const hrow=el('<div></div>'); body.appendChild(hrow); paintHelp(hrow);
  if(me.account) $('#savename').onclick=async()=>{ await api('/v1/account/name',{method:'POST',body:JSON.stringify({name:$('#nm').value})}); state.me=null; alertBanner('Nama tersimpan.'); go('account'); };
  if(me.fleet){

        <button class="cta ghost" id="seeroam" style="margin-top:10px">Lihat charger mitra</button>`;
      $('#seeroam').onclick=()=>go(isWide()?'home':'stations'); }).catch(()=>{});
  }
  if(me.account||me.fleet){
    const out=el('<button class="cta ghost" id="signout" style="margin-top:16px;color:var(--danger)">Keluar</button>');
    body.appendChild(out); out.onclick=async()=>{ await api('/v1/signout',{method:'POST'}); state.me=null; alertBanner('Anda telah keluar.'); go('account'); };
    return;
  }
  // auth forms
  const authbox=$('#authbox');
  const paintPhone=()=>{
    authbox.innerHTML=`<div class="field"><label>Nomor HP</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="08xxxxxxxxxx" /></div>
      <button class="cta" id="send" style="margin-top:14px">Kirim kode</button>`;
    $('#send').onclick=async()=>{ const phone=$('#phone').value.trim(); if(!phone)return;
      $('#send').innerHTML='<span class="spinner"></span>';
      try{ const r=await api('/v1/otp/send',{method:'POST',body:JSON.stringify({phone})}); paintOtp(phone,r.devCode); }
      catch(e){ alertBanner(e.message); $('#send').textContent='Kirim kode'; } };
  };
  const paintOtp=(phone,devCode)=>{
    authbox.innerHTML=`<div class="banner b-info">${svg(I.info)}<div>Kode dikirim ke <b>${esc(phone)}</b>.${devCode?` <span class="muted">(demo: ${devCode})</span>`:''}</div></div>
      <div class="field"><label>Kode verifikasi</label><input id="otp" class="otp-in" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" ${devCode?`value="${devCode}"`:''} /></div>
      <button class="cta" id="verify" style="margin-top:14px">Verifikasi</button>
      <button class="cta ghost" id="rephone" style="margin-top:10px">Ganti nomor</button>`;
    $('#verify').onclick=async()=>{ const code=$('#otp').value.trim();
      $('#verify').innerHTML='<span class="spinner"></span>';
      try{ await api('/v1/otp/verify',{method:'POST',body:JSON.stringify({phone,code})}); state.me=null; haptic(); alertBanner('Berhasil masuk.'); go('account'); }
      catch(e){ alertBanner(e.message); $('#verify').textContent='Verifikasi'; } };
    $('#rephone').onclick=paintPhone;
  };
  const paintFleet=()=>{
    authbox.innerHTML=`<div class="field"><label>Kode organisasi</label><input id="org" placeholder="mis. nusantara-charge" autocapitalize="none" autocorrect="off" spellcheck="false" /></div>
      <div class="field"><label>Nomor kartu RFID</label><input id="rfid" placeholder="FLEET-…" autocapitalize="characters" autocorrect="off" spellcheck="false" /></div>
      <div class="field"><label>PIN</label><input id="pin" inputmode="numeric" type="password" autocomplete="off" placeholder="••••" /></div>
      <button class="cta" id="flogin" style="margin-top:14px">Masuk armada</button>`;
    $('#flogin').onclick=async()=>{ $('#flogin').innerHTML='<span class="spinner"></span>';
      try{ await api('/v1/fleet/login',{method:'POST',body:JSON.stringify({orgSlug:$('#org').value.trim(),rfidUid:$('#rfid').value.trim(),pin:$('#pin').value.trim()})});
        state.me=null; haptic(); alertBanner('Berhasil masuk sebagai armada.'); go('account'); }
      catch(e){ alertBanner(e.message); $('#flogin').textContent='Masuk armada'; } };
  };
  paintPhone();
  $('#mode').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    $('#mode').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    b.dataset.m==='phone'?paintPhone():paintFleet();
  });
};

/** A white-label app: the operator's support contacts and legal pages. */
function paintHelp(box){
  const b=window.BRAND; if(!b) return;
  const rows=[];
  if(b.supportPhone) rows.push(`<a class="helprow" href="https://wa.me/${esc(b.supportPhone.replace(/\D/g,''))}" target="_blank" rel="noopener">${svg(I.info)}<span>WhatsApp ${esc(b.supportPhone)}</span></a>`);
  if(b.supportEmail) rows.push(`<a class="helprow" href="mailto:${esc(b.supportEmail)}">${svg(I.info)}<span>${esc(b.supportEmail)}</span></a>`);
  if(b.privacyUrl) rows.push(`<a class="helprow" href="${esc(b.privacyUrl)}" target="_blank" rel="noopener">${svg(I.globe)}<span>Kebijakan privasi</span></a>`);
  if(b.termsUrl) rows.push(`<a class="helprow" href="${esc(b.termsUrl)}" target="_blank" rel="noopener">${svg(I.globe)}<span>Syarat penggunaan</span></a>`);
  if(!rows.length) return;
  box.innerHTML=`<div class="seclabel">Bantuan</div><div class="card soft">${rows.join('')}</div>`;
}

/** Saved cards: the acquirer keeps the card; the app shows brand, last digits, expiry, and where it can pay. */
async function paintCards(row){
  let d; try{ d=await api('/v1/cards'); }catch(e){ return; }
  if(!row.isConnected||!d.signedIn||!d.cards.length) return;
  const exp=(k)=>k.expMonth&&k.expYear?String(k.expMonth).padStart(2,'0')+'/'+String(k.expYear).slice(-2):'';
  const wal=(k)=>k.kind==='ewallet';
  row.innerHTML=`<div class="seclabel">Kartu &amp; e-wallet</div>`+d.cards.map((k)=>`<div class="setrow" style="margin-top:8px"><div class="ic">${svg(wal(k)?I.wallet:I.card)}</div>
      <div style="flex:1;min-width:0"><div class="t">${wal(k)?esc((METHOD_UI[k.channel]||[k.channel])[0])+' '+esc(k.accountLabel||''):cardName(k)}${!wal(k)&&exp(k)?` <span class="muted small">${esc(exp(k))}</span>`:''}</div>
        <div class="s">${k.expired?'Kedaluwarsa':wal(k)&&k.status==='pending'?'Menunggu persetujuan · '+esc(k.usableAt):(wal(k)?'Terhubung · ':'')+'Untuk '+esc(k.usableAt)}</div></div>
      <button class="cta ghost" type="button" data-rmcard="${esc(k.id)}" style="width:auto;padding:9px 14px;font-size:13.5px">${wal(k)?'Putuskan':'Hapus'}</button></div>`).join('')+
    `<div class="small muted" style="margin-top:8px">Nomor kartu dan akses e-wallet disimpan oleh penyedia pembayaran, bukan oleh PlugSure.</div>`;
  row.querySelectorAll('[data-rmcard]').forEach((b)=>b.onclick=async()=>{ if(!confirm(window.tstr(b.textContent.trim()==='Putuskan'?'Putuskan e-wallet ini?':'Hapus kartu ini?'))) return;
    b.disabled=true; try{ await api('/v1/cards/'+b.dataset.rmcard,{method:'DELETE'}); try{ if(LS.getItem('ps_method')==='SAVED:'+b.dataset.rmcard) LS.removeItem('ps_method'); }catch(e){} haptic(); paintCards(row); }
    catch(e){ alertBanner(e.message); b.disabled=false; } });
  if(!d.cards.length) row.innerHTML='';
}

/** Memberships: the driver's passes and the plans operators offer in the app. */
async function paintMembership(row){
  let d; try{ d=await api('/v1/memberships'); }catch(e){ return; }
  if(!row.isConnected||(!d.plans.length&&!d.memberships.length)) return;
  const perks=(p)=>[p.memberRateIdr!=null?`${rp(p.memberRateIdr)}/kWh`:'',p.energyDiscountPercent?`Diskon ${p.energyDiscountPercent}% energi`:'',
    p.includedKwh?`${kwhQ(p.includedKwh)} kWh gratis`:'',p.waiveSessionFees?'Tanpa biaya layanan':'',p.currentType?`Khusus ${p.currentType}`:''].filter(Boolean).join(' · ');
  const until=(iso)=>new Date(iso).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
  const mine=d.memberships.filter((m)=>m.status!=='ended');
  // Saved cards and linked e-wallets usable at a membership's operator (for automatic renewal).
  const methodsFor=(m)=>{ const p=d.plans.find((x)=>x.operator===m.operator); return p?(p.savedCards||[]).concat(p.linkedWallets||[]):[]; };
  const mLabel=(k)=>k.kind==='ewallet'||k.channel?esc((METHOD_UI[k.channel]||[k.channel||'E-wallet'])[0])+(k.accountLabel?' '+esc(k.accountLabel):''):cardName(k);
  const renewBox=(m)=>{
    if(m.status!=='active') return '';
    if(m.pendingRenewal){ const ch=(METHOD_UI[m.pendingRenewal.channel]||[m.pendingRenewal.channel||'e-wallet'])[0];
      return `<div class="perks" style="margin-top:6px">Perpanjangan menunggu konfirmasi Anda di ${esc(ch)}.</div>${m.pendingRenewal.checkoutUrl?`<a class="cta ghost" href="${esc(m.pendingRenewal.checkoutUrl)}" target="_blank" rel="noopener" style="margin-top:8px;display:block;text-align:center">Konfirmasi di ${esc(ch)}</a>`:''}`; }
    if(m.autoRenew&&m.renewMethod) return `<div class="perks" style="margin-top:6px">Diperpanjang otomatis dengan ${esc(m.renewMethod.label)}</div>${m.renewError?'<div class="perks" style="color:var(--warn)">Perpanjangan terakhir belum berhasil. Kami coba lagi, atau perpanjang sekarang.</div>':''}
      <button class="cta ghost" type="button" data-renewoff="${esc(m.id)}" style="margin-top:8px">Matikan</button>`;
    const list=methodsFor(m);
    return list.length?`<button class="cta ghost" type="button" data-renewon="${esc(m.id)}" style="margin-top:8px">Perpanjang otomatis</button>`
      :'<div class="small muted" style="margin-top:6px">Simpan kartu atau hubungkan e-wallet saat membayar untuk perpanjangan otomatis.</div>';
  };
  row.innerHTML=`<div class="seclabel">Langganan</div>`+
    mine.map((m)=>`<div class="plan mine"><div class="op">${esc(m.operator)}</div><div class="nm">${esc(m.name)}</div>
      <div class="perks">${m.status==='active'?`Aktif sampai ${esc(until(m.periodEnd))}`:'Menunggu pembayaran'}</div>
      ${m.includedKwh&&m.status==='active'?`<div class="perks">Sisa ${kwhQ(m.remainingKwh)} dari ${kwhQ(m.includedKwh)} kWh</div><div class="meter"><i style="width:${Math.round(100*m.remainingKwh/m.includedKwh)}%"></i></div>`:''}
      ${renewBox(m)}</div>`).join('')+
    d.plans.map((p)=>{ const active=mine.some((m)=>m.planId===p.id&&m.status==='active');
      const sw=p.switch;
      return `<div class="plan"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
        <div style="min-width:0"><div class="op">${esc(p.operator)}</div><div class="nm">${esc(p.name)}</div><div class="perks">${esc(perks(p))}</div></div>
        <div style="text-align:right;flex:none"><div class="price">${rp(p.totalIdr)}</div><div class="op">/ ${p.days} hari</div></div></div>
        ${sw?`<div class="perks" style="margin-top:6px">${sw.payTotalIdr?`Sisa hari paket Anda: potongan ${rp(sw.creditIdr)}. Bayar ${rp(sw.payTotalIdr)}.`:`Sisa hari paket Anda menutup paket ini: gratis, berlaku ${sw.days} hari.`}</div>`:''}
        <button class="cta ghost" type="button" data-buy="${esc(p.id)}" style="margin-top:10px"${d.signedIn?'':' disabled'}>${active?'Perpanjang 30 hari':sw?'Ganti ke paket ini':'Berlangganan'}</button></div>`; }).join('')+
    (d.signedIn?'':`<div class="small muted" style="margin-top:8px">Masuk dengan nomor HP untuk berlangganan.</div>`)+
    `<div class="small muted" style="margin-top:8px">Berlaku 30 hari. Perpanjang sendiri, atau otomatis dengan kartu tersimpan atau e-wallet terhubung. Ganti paket kapan saja: sisa hari paket lama menjadi potongan. Harga member otomatis berlaku saat mengisi di operator tersebut.</div>`;
  row.querySelectorAll('[data-renewoff]').forEach((b)=>b.onclick=async()=>{ b.disabled=true;
    try{ await api('/v1/memberships/'+b.dataset.renewoff+'/auto-renew',{method:'PUT',body:JSON.stringify({enabled:false})}); haptic(); alertBanner('Perpanjangan otomatis dimatikan.'); paintMembership(row); }
    catch(e){ alertBanner(e.message); b.disabled=false; } });
  row.querySelectorAll('[data-renewon]').forEach((b)=>b.onclick=async()=>{
    const m=mine.find((x)=>x.id===b.dataset.renewon); const list=methodsFor(m);
    const on=async(id)=>{ b.disabled=true; try{ await api('/v1/memberships/'+m.id+'/auto-renew',{method:'PUT',body:JSON.stringify({enabled:true,methodId:id})}); haptic(); alertBanner('Perpanjangan otomatis aktif.'); paintMembership(row); }catch(e){ alertBanner(e.message); b.disabled=false; } };
    if(list.length===1) return on(list[0].id);
    const box=el(`<div style="margin-top:8px"><div class="small muted">Pilih kartu atau e-wallet untuk perpanjangan:</div>${list.map((k)=>`<button class="cta ghost" type="button" data-pickm="${esc(k.id)}" style="margin-top:6px">${mLabel(k)}</button>`).join('')}</div>`);
    b.replaceWith(box); box.querySelectorAll('[data-pickm]').forEach((x)=>x.onclick=()=>on(x.dataset.pickm)); });
  const buy=async(b,m)=>{ haptic(); const label=b.textContent; b.disabled=true; b.innerHTML='<span class="spinner"></span>';
    try{ state._mpay=await api('/v1/memberships',{method:'POST',body:JSON.stringify({planId:b.dataset.buy,...(m||{})})});
      if(state._mpay.paid||(state._mpay.payment&&state._mpay.payment.action==='done')){ haptic(); alertBanner(state._mpay.creditIdr&&!state._mpay.totalIdr?'Paket diganti. Berlaku sampai '+until(state._mpay.periodEnd)+'.':'Langganan aktif.'); return go('account'); }
      rememberCheckout('mpay',state._mpay); go('mpay',{_back:()=>go('account')}); }
    catch(e){ alertBanner(e.message); if(e.body&&(e.body.code==='wallet_link_ended'||e.body.code==='saved_card_ended')) return go('account'); b.disabled=false; b.textContent=label; } };
  row.querySelectorAll('[data-buy]').forEach((b)=>b.onclick=()=>{
    const plan=d.plans.find((p)=>p.id===b.dataset.buy); const list=(plan&&plan.paymentMethods)||[];
    const saved=(list.some((m)=>m.channel==='CARD')?(plan.savedCards||[]):[]).concat(plan.linkedWallets||[]);
    // A saved card or linked e-wallet can also renew the pass automatically.
    const withRenew=(m)=>{ const ar=b.parentNode&&b.parentNode.querySelector('[data-autorenew]'); return ar&&ar.checked&&m&&(m.savedCardId||m.walletId)?{...m,autoRenew:true}:m; };
    if(list.length+saved.length<=1||b.dataset.picking) return buy(b,withRenew(b._pick?b._pick.value():(list[0]?{method:list[0].channel}:null)));
    // More than one way to pay: choose first, then the same button pays.
    const box=el('<div style="margin-top:10px"></div>'); b.before(box);
    b._pick=methodPicker(box,list,{savedCards:plan.savedCards,canSaveCard:plan.canSaveCard,linkedWallets:plan.linkedWallets}); b.dataset.picking='1';
    b.textContent='Bayar '+rp(plan.switch?plan.switch.payTotalIdr:plan.totalIdr);
    if(saved.length) b.before(el('<label class="small" style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" data-autorenew> <span>Perpanjang otomatis dengan kartu tersimpan atau e-wallet terhubung</span></label>'));
  });
}

/** Loyalty points at each operator that runs a program: balance, "use my points", expiring soon, recent history. */
async function paintLoyalty(row){

  const KIND={earn:'Diperoleh',redeem:'Dipakai',expire:'Kedaluwarsa',adjust:'Penyesuaian'};

      <div class="op">${esc(o.operator)}</div><div class="nm">${o.balance.toLocaleString('id-ID')} poin</div>
      <div class="perks">≈ ${rp(o.valueIdr)}</div>

      ${o.enabled?`<label class="small" style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" data-autoredeem="${esc(o.orgId)}"${o.autoRedeem?' checked':''}> <span>Pakai poin otomatis saat mengisi</span></label>
      <div class="small muted" style="margin-top:6px">${o.earnPer1000Idr} poin per Rp 1.000. 1 poin = ${rp(o.pointValueIdr)}, paling banyak ${o.maxRedeemPercent}% biaya energi dan layanan, sebelum pajak.</div>`:''}
      ${o.history.length?`<details style="margin-top:8px"><summary class="small">Riwayat poin</summary>${o.history.map((h)=>`<div class="rc-line small"><span class="d">${esc(KIND[h.kind]||h.kind)} · ${esc(day(h.at))}</span><span class="a">${h.points>0?'+':''}${h.points.toLocaleString('id-ID')}</span></div>`).join('')}</details>`:''}

    catch(e){ alertBanner(e.message); x.checked=!x.checked; } finally{ x.disabled=false; } });
}

/** Paying a reservation fee: QRIS here, or the e-wallet / card page; the connector is held once it is paid. */
VIEWS.rpay=async(v)=>{
  v.className='view full';
  const co=state._rpay; if(!co||!co.checkout){ return go('home'); }
  const id=co.checkout.id, amount=co.checkout.totalIdr;
  const back=()=>co.connectorId?openConnector(co.connectorId):go('home');
  const status=()=>api('/v1/reservations/checkout/'+id);
  const confirmPath='/v1/reservations/checkout/'+id+'/confirm-payment';
  let finished=false;
  const done=async()=>{ if(finished) return; finished=true; if(state.poll){clearInterval(state.poll);state.poll=null;} forgetCheckout(); haptic();
    let s=null; try{ s=await status(); }catch(e){}
    if(s&&s.state==='held') alertBanner('Konektor dipesan.');
    else if(s&&s.state==='failed') alertBanner((s.problem||'Charger menolak reservasi.')+' Biaya reservasi dikembalikan.');
    else if(s&&s.state==='expired') alertBanner('Pembayaran tidak selesai. Konektor tidak dipesan.');
    back(); };
  const isPaid=async()=>{ const s=await status(); return s.state!=='pending'; };
  if(co.payment&&co.payment.action!=='qr'){
    return paintCheckout(v,co,{amountIdr:amount,note:'Biaya reservasi',view:'rpay',title:'Bayar biaya reservasi',info:'Setelah membayar, kembali ke sini: charger langsung menahan konektor untuk Anda.',confirmPath,isPaid,onPaid:done});
  }
  v.innerHTML=topbar('Bayar biaya reservasi',co.checkout.siteName||'',{back:1})+
    `<div class="qrwrap"><img src="${co.qr.qrImage}" alt="QRIS" /></div>
     <div class="paylabel"><div class="amt">${rp(amount)}</div><div class="qris-badge">QRIS · biaya reservasi</div></div>
     <div class="card soft small" style="margin-top:18px">Setelah membayar, charger langsung menahan konektor untuk Anda.</div>
     <div style="margin-top:18px"><div class="center-loading" style="padding:16px;gap:12px;flex-direction:column"><span class="spinner"></span><div class="muted small">Menunggu pembayaran…</div></div>
     ${co.demo!==false?'<button class="cta ghost" id="rpaid" type="button">Simulasikan pembayaran (demo)</button>':''}
     <button class="cta ghost" id="rcancelpay" type="button" style="margin-top:8px">Batalkan</button></div>`;
  if($('#rpaid')) $('#rpaid').onclick=async()=>{ $('#rpaid').innerHTML='<span class="spinner"></span>';
    try{ await api(confirmPath,{method:'POST'}); }catch(e){ alertBanner(e.message); } done(); };
  $('#rcancelpay').onclick=async()=>{ haptic(); try{ await api('/v1/reservations/checkout/'+id+'/cancel',{method:'POST'}); }catch(e){} finished=true; if(state.poll){clearInterval(state.poll);state.poll=null;} forgetCheckout(); back(); };
  const check=async()=>{ try{ if(state.view==='rpay'&&await isPaid()) done(); }catch(e){} };
  state.poll=setInterval(check,2500); check();
};

/** Paying an unpaid session (an expired card hold, or post-pay whose link ended): QRIS here, or the e-wallet / card page; back to the receipt once paid. */
VIEWS.spay=async(v)=>{
  v.className='view full';
  const co=state._spay; if(!co){ return go('home'); }
  const back=()=>go('receipt',{chargeId:co.chargeId,_back:()=>go('home')});
  const isPaid=async()=>{ const s=await api('/v1/charge/'+co.chargeId+'/pay-unpaid'); return s.paid===true; };
  const confirmPath='/v1/charge/'+co.chargeId+'/pay-unpaid/confirm-payment';
  const done=()=>{ if(state.poll){clearInterval(state.poll);state.poll=null;} forgetCheckout(); haptic(); alertBanner('Pembayaran berhasil. Terima kasih.'); back(); };
  if(co.payment&&co.payment.action!=='qr'){
    return paintCheckout(v,co,{amountIdr:co.amountIdr,note:'Sesi pengisian',view:'spay',title:'Bayar sesi pengisian',info:'Setelah membayar, kembali ke sini: struk sesi Anda diperbarui.',confirmPath,isPaid,onPaid:done});
  }
  v.innerHTML=topbar('Bayar sesi pengisian','Belum terbayar',{back:1})+
    `<div class="qrwrap"><img src="${co.qr.qrImage}" alt="QRIS" /></div>
     <div class="paylabel"><div class="amt">${rp(co.amountIdr)}</div><div class="qris-badge">QRIS · sesi pengisian</div></div>
     <button class="cta ghost" id="ssaveqr" style="margin-top:16px">${svg(I.save)} Simpan QR</button>
     <div class="small muted" id="ssaveqr-hint" style="text-align:center;margin-top:8px">Bayar dari HP ini? Simpan QR, lalu pilih gambarnya dari galeri di aplikasi bank / e-wallet.</div>
     <div id="swait" style="margin-top:18px"><div class="center-loading" style="padding:16px;gap:12px;flex-direction:column"><span class="spinner"></span><div class="muted small">Menunggu pembayaran…</div></div>
     ${co.demo!==false?'<button class="cta ghost" id="spaid" type="button">Simulasikan pembayaran (demo)</button>':''}</div>`;
  // A phone cannot scan its own screen: save the QR and pick it from the gallery in the bank app.
  $('#ssaveqr').onclick=async()=>{ const b=$('#ssaveqr'); b.disabled=true;
    try{ if(await saveQrImage(co,'Sesi pengisian · belum terbayar')) $('#ssaveqr-hint').innerHTML='<b>QR tersimpan.</b> Buka aplikasi bank / e-wallet → Bayar / Scan QR → pilih gambar dari galeri. Kembali ke sini setelah membayar; struk diperbarui otomatis.'; }
    catch(e){ alertBanner('Gagal menyimpan QR. Coba tangkap layar (screenshot).'); } finally{ b.disabled=false; } };
  // Back from the bank app: check at once.
  const onVisible=()=>{ if(document.visibilityState==='visible'&&state.view==='spay') check(); };
  document.addEventListener('visibilitychange',onVisible);
  const stopWatching=()=>{ if(state.view!=='spay'){ document.removeEventListener('visibilitychange',onVisible); window.removeEventListener('hashchange',stopWatching); } };
  window.addEventListener('hashchange',stopWatching);
  if($('#spaid')) $('#spaid').onclick=async()=>{ $('#spaid').innerHTML='<span class="spinner"></span>';
    try{ await api(confirmPath,{method:'POST'}); done(); }catch(e){ alertBanner(e.message); $('#spaid').textContent='Simulasikan pembayaran (demo)'; } };
  const check=async()=>{ try{ if(state.view==='spay'&&await isPaid()) done(); }catch(e){} };
  state.poll=setInterval(check,2500);
};

VIEWS.mpay=async(v)=>{
  v.className='view full';
  const co=state._mpay; if(!co){ return go('account'); }
  const until=new Date(co.periodEnd).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  if(co.payment&&co.payment.action!=='qr'){
    return paintCheckout(v,co,{amountIdr:co.totalIdr,note:`Berlaku sampai ${until}`,view:'mpay',title:`Bayar langganan · ${co.plan}`,
      confirmPath:'/v1/memberships/charges/'+co.chargeId+'/confirm-payment',
      isPaid:async()=>{ const s=await api('/v1/memberships/charges/'+co.chargeId); return s.state==='paid'; },
      onPaid:()=>{ forgetCheckout(); alertBanner('Langganan aktif. Harga member berlaku sampai '+until+'.'); go('account'); }});
  }
  v.innerHTML=topbar('Bayar langganan',`${co.plan} · ${co.operator}`,{back:1})+
    `<div class="qrwrap"><img src="${co.qr.qrImage}" alt="QRIS" /></div>
     <div class="paylabel"><div class="amt">${rp(co.totalIdr)}</div><div class="qris-badge">Berlaku sampai ${esc(until)}</div></div>
     <div class="card soft small" style="margin-top:16px">
       <div class="rc-line"><span class="d">${esc(co.plan)} (30 hari)</span><span class="a">${rp(co.feeIdr)}</span></div>
       ${co.ppnIdr?`<div class="rc-line"><span class="d">PPN 12% × DPP</span><span class="a">${rp(co.ppnIdr)}</span></div>`:''}
       <div class="rc-line tot"><span class="d">Total</span><span class="a">${rp(co.totalIdr)}</span></div></div>
     <button class="cta ghost" id="msaveqr" style="margin-top:16px">${svg(I.save)} Simpan QR</button>
     <div class="small muted" id="msaveqr-hint" style="text-align:center;margin-top:8px">Bayar dari HP ini? Simpan QR, lalu pilih gambarnya dari galeri di aplikasi bank / e-wallet.</div>
     <div id="mwait" style="margin-top:18px"><div class="center-loading" style="padding:16px;gap:12px;flex-direction:column"><span class="spinner"></span><div class="muted small">Menunggu pembayaran…</div></div>
     ${co.demo!==false?'<button class="cta ghost" id="mpaid" type="button">Simulasikan pembayaran (demo)</button>':''}</div>`;
  const done=()=>{ if(state.poll){clearInterval(state.poll);state.poll=null;} haptic();
    $('#mwait').innerHTML=`<div class="banner b-info">${svg(I.check)}<div><div><b>Langganan aktif.</b></div><div>Harga member berlaku sampai ${esc(until)}.</div></div></div><button class="cta" id="mdone" type="button">Selesai</button>`;
    $('#mdone').onclick=()=>go('account'); };
  const check=async()=>{ try{ const s=await api('/v1/memberships/charges/'+co.chargeId); if(s.state==='paid') done(); }catch(e){} };
  // A phone cannot scan its own screen: save the QR and pick it from the gallery in the bank app.
  $('#msaveqr').onclick=async()=>{ const b=$('#msaveqr'); b.disabled=true;
    try{ if(await saveQrImage(co,co.plan+' · 30 hari')) $('#msaveqr-hint').innerHTML='<b>QR tersimpan.</b> Buka aplikasi bank / e-wallet → Bayar / Scan QR → pilih gambar dari galeri. Kembali ke sini setelah membayar; langganan aktif otomatis.'; }
    catch(e){ alertBanner('Gagal menyimpan QR. Coba tangkap layar (screenshot).'); } finally{ b.disabled=false; } };
  const onVisible=()=>{ if(document.visibilityState==='visible'&&state.view==='mpay') check(); };
  document.addEventListener('visibilitychange',onVisible);
  const stopWatching=()=>{ if(state.view!=='mpay'){ document.removeEventListener('visibilitychange',onVisible); window.removeEventListener('hashchange',stopWatching); } };
  window.addEventListener('hashchange',stopWatching);
  if($('#mpaid')) $('#mpaid').onclick=async()=>{ $('#mpaid').innerHTML='<span class="spinner"></span>';
    try{ await api('/v1/memberships/charges/'+co.chargeId+'/confirm-payment',{method:'POST'}); done(); }
    catch(e){ alertBanner(e.message); $('#mpaid').textContent='Simulasikan pembayaran (demo)'; } };
  state.poll=setInterval(check,2500);
};

async function paintNotif(row){
  const st=await pushState();
  if(!row.isConnected) return;
  if(st==='unsupported'){
    // iPhone / iPad: web push works only for the app added to the Home Screen.
    const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    row.innerHTML=ios&&state.meta&&state.meta.push&&state.meta.push.publicKey
      ?`<div class="seclabel">Notifikasi</div><div class="card soft small muted">Di iPhone, tambahkan PlugSure ke Layar Utama (Bagikan → Tambah ke Layar Utama) untuk menerima notifikasi.</div>`:'';
    return;
  }
  const on=st==='on';
  row.innerHTML=`<div class="seclabel">Notifikasi</div>
    <div class="setrow" style="margin-top:0"><div class="ic">${svg(I.bell)}</div>
      <div style="flex:1;min-width:0"><div class="t">Notifikasi pengisian</div>
        <div class="s">${st==='denied'?(NATIVE_PUSH?'Diblokir di Pengaturan iPhone.':'Diblokir di pengaturan browser.'):'Mulai, selesai, struk, dan pengingat reservasi.'}</div></div>
      <button class="switch" role="switch" aria-checked="${on}" aria-label="Notifikasi pengisian" ${st==='denied'?'disabled':''}></button></div>`;
  $('.switch',row).onclick=async(e)=>{ haptic(); const b=e.currentTarget; b.disabled=true;
    try{ if(on){ await disablePush(); alertBanner('Notifikasi dimatikan.'); } else { await enablePush(); alertBanner('Notifikasi aktif.'); } }
    catch(err){ alertBanner(err.message); }
    paintNotif(row); };
}

//────────────────────────────────────────────────────────── toast
function alertBanner(msg){
  const t=el(`<div style="position:fixed;left:50%;bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;
    background:var(--raised-2);color:var(--ink);border:1px solid var(--line-2);padding:12px 18px;border-radius:14px;
    box-shadow:var(--shadow);font-weight:600;font-size:13.5px;max-width:86%;text-align:center">${esc(msg)}</div>`);
  document.body.appendChild(t); setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),300);},2600);
}

//────────────────────────────────────────────────────────── boot
(async function boot(){
  loadTheme();
  try{ await ensureDevice();
    [state.me,state.meta]=await Promise.all([api('/v1/me').catch(()=>null),api('/v1/meta').catch(()=>null)]);
    loadFavs(); }
  catch(e){ document.getElementById('view').innerHTML=`<div class="center-empty" style="margin-top:80px">${svg(I.warn)}<div>Tidak dapat terhubung ke server.</div><div class="small" style="margin-top:8px">${esc(e.message)}</div></div>`; return; }
  document.body.classList.toggle('wide',isWide());
  // Availability changes while the app is open: keep the side list live (only
  // fetched while the side column is actually on screen).
  // Every few seconds while wide and empty (e.g. rotated to landscape without a
  // resize event), otherwise every 30 s.
  let tick=0;
  side.timer=setInterval(()=>{ tick++; if(isWide()&&!document.hidden&&(!side.stations||tick%10===0)) refreshSideStations(); },3000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&isWide()) refreshSideStations(); });
  // The service worker only receives push notifications (it caches nothing).
  if(NATIVE_PUSH){
    // A tapped notification opens its screen; a token can change (restore, reinstall), so register again on start.
    NATIVE_PUSH.addListener('pushNotificationActionPerformed',(a)=>{ onNativeAction(a).catch(()=>{}); });
    watchLiveActivities();
    NATIVE_PUSH.checkPermissions().then((p)=>{ if(p.receive==='granted'&&LS.getItem(APNS_LS)) nativeRegister().catch(()=>{}); }).catch(()=>{});
  } else if(pushSupported()) navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});
  // Notifications follow the language toggle.
  const setLang0=window.setLang; window.setLang=(l)=>{ setLang0(l); syncPushLang(); };
  if(!handleHash()) render();
})();
</script>
