<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1417">
<title>PlugSure — Isi daya mobil listrik</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20120%20120%22%3E%3Crect%20width%3D%22120%22%20height%3D%22120%22%20rx%3D%2228%22%20fill%3D%22%231b4d8c%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2222%22%20width%3D%2210%22%20height%3D%2228%22%20rx%3D%225%22%20fill%3D%22%232fd6a7%22%2F%3E%3Crect%20x%3D%2270%22%20y%3D%2222%22%20width%3D%2210%22%20height%3D%2228%22%20rx%3D%225%22%20fill%3D%22%232fd6a7%22%2F%3E%3Cpath%20d%3D%22M32%2068%2056%2092%2092%2046%22%20stroke%3D%22%232fd6a7%22%20stroke-width%3D%2212%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20fill%3D%22none%22%2F%3E%3C%2Fsvg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap">
<style>
:root{
  /* dark-first — public charging happens in basements and at night */
  --bg:#0a1417; --surface:#0f1e22; --raised:#15282d; --raised-2:#1b333a;
  --ink:#eaf4f2; --body:#b6cbc9; --muted:#a0b6b3; --faint:#5a716f;   /* faint: decoration only, never text */
  --line:#20383e; --line-2:#2b4a51;
  --arus:#2fd6a7; --arus-deep:#17b892; --arus-glow:rgba(47,214,167,.18);
  /* Text/icons ON a solid arus or danger fill (Pay, Scan, Stop, active banner).
     Dark ink on the bright dark-theme fills; white on the deeper light-theme ones. */
  --on-arus:#04231d; --on-danger:#2b0b08;
  --ocean:#1b4d8c; /* PlugSure brand ocean blue (logo badge) */
  --amber:#f5b545; --amber-soft:#2a2211;
  --danger:#ff6b5e; --danger-soft:#2c1512;
  --ok:#4fd39a; --ok-soft:#0f2a20;
  --sky:#5cc8f0;
  --f-num:"Sora","Plus Jakarta Sans",system-ui,sans-serif;
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
  --shadow:0 8px 30px rgba(0,0,0,.4);
  --tab-h:64px;
  /* Tells the browser the page is dark, so its own parts — scrollbars, autofill
     highlight, built-in control colours — are drawn dark too. */
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef3f2; --surface:#ffffff; --raised:#ffffff; --raised-2:#f2f6f5;
  /* Contrast-checked against WCAG AA (4.5:1) on every light surface they sit on. */
  --ink:#0c1a1d; --body:#334b48; --muted:#566c68; --faint:#8aa19d;
  --line:#dde6e4; --line-2:#cbd8d5;
  --arus:#08735f; --arus-deep:#065c4c; --arus-glow:rgba(8,115,95,.12);
  --on-arus:#ffffff; --on-danger:#ffffff;
  --amber:#865c0c; --amber-soft:#f8efd9;
  --danger:#b23327; --danger-soft:#f8e2df;
  --ok:#0e6e4f; --ok-soft:#dcefe6;
  --sky:#1f6f97;
  --shadow:0 8px 26px rgba(20,40,45,.12);
  color-scheme:light;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--body);font-family:var(--f-ui);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--arus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* phone shell — looks like an app even on a desktop */
#app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;
     background:var(--bg);position:relative;display:flex;flex-direction:column}
/* The framed "phone card" look is for tall screens only (tablet / desktop). A
   landscape phone is wide but short, and gets the plain full-height app.
   overflow:clip, not hidden: hidden makes #app a scroll container, which silently
   broke every position:sticky inside it (header and Pay button scrolled away). */
/* On a tablet or desktop the card is a sheet anchored to the bottom of the
   screen (rounded at the top only). It used to float with a 2vh gap below it,
   so on short pages the fixed tab bar hung 20px outside the card's bottom edge. */
@media (min-width:520px) and (min-height:600px){
  html{scrollbar-gutter:stable}   /* no sideways jump when a page gets a scrollbar */
  #app{min-height:98vh;min-height:calc(100dvh - 2vh);margin-top:2vh;border-radius:26px 26px 0 0;overflow:hidden;overflow:clip;
       box-shadow:0 20px 70px rgba(0,0,0,.5);border:1px solid var(--line);border-bottom:0}
  body{background:radial-gradient(120% 80% at 50% -10%, #10262b 0%, var(--bg) 55%)}
  :root[data-theme="light"] body{background:radial-gradient(120% 80% at 50% -10%, #d3e6e2 0%, var(--bg) 55%)}
}

/* view container — env(safe-area-inset-*) keeps content clear of the notch and
   the home indicator when installed to the home screen (viewport-fit=cover). */
.view{flex:1;padding:0 18px calc(var(--tab-h) + 24px + env(safe-area-inset-bottom));animation:fade .28s ease}
.view.full{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:calc(18px + env(safe-area-inset-top)) 2px 14px;position:sticky;top:0;
     background:linear-gradient(var(--bg) 70%, transparent);z-index:5}
.top h1{font-family:var(--f-num);font-weight:700;font-size:20px;color:var(--ink);margin:0;letter-spacing:-.02em}
.top .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.top .back{width:42px;height:42px;border-radius:12px;background:var(--raised);
           display:grid;place-items:center;color:var(--ink);flex:none}
.top .spacer{flex:1}
.brandmark{display:flex;align-items:center;gap:9px}
.bolt{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
      background:linear-gradient(145deg,var(--arus),var(--arus-deep));color:var(--on-arus);
      box-shadow:0 4px 14px var(--arus-glow)}
.bolt svg{width:19px;height:19px}
/* official PlugSure logo badge (ocean-blue, self-contained rounded mark) */
.brand-badge{width:36px;height:36px;flex:none;display:block;border-radius:9px;
      box-shadow:0 4px 14px rgba(27,77,140,.35)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.card+.card{margin-top:12px}
/* Leading icon in an info card (station address, payment note). Without a size
   an inline SVG fills the whole card. */
.card > svg{width:19px;height:19px;flex:none;color:var(--arus);margin-top:1px}
.soft{background:var(--raised)}

/* the hero scan action */
.hero{margin-top:6px;border-radius:24px;padding:22px 20px 24px;position:relative;overflow:hidden;
      background:
        radial-gradient(90% 120% at 85% -20%, var(--arus-glow), transparent 60%),
        linear-gradient(160deg, var(--raised-2), var(--surface));
      border:1px solid var(--line-2)}
.hero h2{font-family:var(--f-num);font-weight:700;font-size:22px;color:var(--ink);margin:0 0 4px;letter-spacing:-.02em}
.hero p{margin:0 0 18px;color:var(--body);font-size:14px;max-width:30ch}
.scan-btn{width:100%;padding:17px;border-radius:16px;font-family:var(--f-ui);font-weight:700;font-size:16.5px;
          color:var(--on-arus);background:linear-gradient(145deg,var(--arus),var(--arus-deep));
          display:flex;align-items:center;justify-content:center;gap:11px;
          box-shadow:0 8px 24px var(--arus-glow);transition:transform .12s}
.scan-btn:active{transform:scale(.98)}
.scan-btn svg{width:22px;height:22px}
.hero .or{display:flex;align-items:center;gap:10px;margin:14px 2px 2px;color:var(--body);font-size:12px}
.hero .or::before,.hero .or::after{content:"";height:1px;flex:1;background:var(--line-2)}
.linkrow{display:flex;gap:10px;margin-top:12px}
.linkrow button{flex:1;padding:12px;border-radius:13px;background:var(--surface);border:1px solid var(--line);
                color:var(--ink);font-weight:600;font-size:13.5px;display:flex;flex-direction:column;
                align-items:center;gap:6px}
.linkrow button svg{width:20px;height:20px;color:var(--arus)}

/* section label */
.seclabel{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
          color:var(--muted);margin:24px 4px 10px;display:flex;align-items:center;justify-content:space-between}
.seclabel a{color:var(--arus);font-weight:600;text-transform:none;letter-spacing:0;font-size:13px;
            padding:12px 4px 12px 12px;margin:-12px -4px -12px 0;cursor:pointer}

/* station row */
.station{display:flex;gap:13px;align-items:flex-start;padding:14px;border-radius:16px;
         background:var(--surface);border:1px solid var(--line);width:100%;text-align:left;margin-bottom:10px}
.station:active{border-color:var(--line-2)}
.stnicon{width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;
         background:var(--raised-2);color:var(--arus);font-family:var(--f-num);font-weight:700;font-size:15px}
.station .nm{font-weight:700;color:var(--ink);font-size:15px;line-height:1.25}
.station .meta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.station .meta b{color:var(--body);font-weight:600}
.dot{width:5px;height:5px;border-radius:50%;background:var(--faint);align-self:center}
.avail{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12.5px}
.avail .ind{width:8px;height:8px;border-radius:50%}
.av-yes .ind{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)} .av-yes{color:var(--ok)}
.av-no .ind{background:var(--faint)} .av-no{color:var(--muted)}
.pricetag{margin-left:auto;text-align:right;flex:none}
.pricetag .p{font-family:var(--f-num);font-weight:700;color:var(--ink);font-size:15px}
.pricetag .u{font-size:11px;color:var(--muted)}

/* connector detail */
.conhead{display:flex;gap:14px;align-items:center;margin:8px 0 4px}
.contype{width:56px;height:56px;border-radius:16px;flex:none;display:grid;place-items:center;
         background:var(--raised-2);color:var(--arus)}
.contype svg{width:30px;height:30px}
.big-num{font-family:var(--f-num);font-weight:800;letter-spacing:-.02em;color:var(--ink);
         font-variant-numeric:tabular-nums}
.btntxt{display:inline}
.statuspill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
            font-size:12.5px;font-weight:700}
.sp-ok{background:var(--ok-soft);color:var(--ok)} .sp-busy{background:var(--amber-soft);color:var(--amber)}
.sp-off{background:var(--raised-2);color:var(--muted)} .sp-block{background:var(--danger-soft);color:var(--danger)}

.speclist{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.spec{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:12px 13px}
.spec .k{font-size:11.5px;color:var(--muted);font-weight:600}
.spec .v{font-family:var(--f-num);font-weight:700;color:var(--ink);font-size:17px;margin-top:2px;font-variant-numeric:tabular-nums}
.spec .v small{font-size:12px;color:var(--muted);font-weight:600}

/* amount chips */
.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:6px}
.chip{padding:15px 6px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);
      text-align:center;font-family:var(--f-num);font-weight:700;font-size:16px;color:var(--ink);
      font-variant-numeric:tabular-nums;transition:.12s}
.chip small{display:block;font-family:var(--f-ui);font-size:11px;color:var(--muted);font-weight:600;margin-top:3px}
.chip.sel{border-color:var(--arus);background:var(--arus-glow);color:var(--ink)}
.chip.sel small{color:var(--arus-deep)}
.custom-in{margin-top:10px;display:flex;align-items:center;gap:10px;background:var(--surface);
           border:1.5px solid var(--line);border-radius:14px;padding:4px 14px}
.custom-in span{font-family:var(--f-num);font-weight:700;color:var(--muted);font-size:16px}
.custom-in input{flex:1;border:0;background:none;color:var(--ink);font-family:var(--f-num);
                 font-weight:700;font-size:19px;padding:12px 0;outline:none;font-variant-numeric:tabular-nums}
.quote-line{margin-top:14px;padding:14px;border-radius:14px;background:var(--raised);
            border:1px dashed var(--line-2);display:flex;align-items:center;justify-content:space-between}
.quote-line .est{font-family:var(--f-num);font-weight:800;font-size:26px;color:var(--arus);line-height:1;font-variant-numeric:tabular-nums}
.quote-line .lbl{font-size:12px;color:var(--muted);margin-top:3px}

/* primary button */
.cta{width:100%;padding:16px;border-radius:15px;font-family:var(--f-ui);font-weight:700;font-size:16px;
     color:var(--on-arus);background:linear-gradient(145deg,var(--arus),var(--arus-deep));
     box-shadow:0 6px 20px var(--arus-glow);transition:transform .12s;
     display:flex;align-items:center;justify-content:center;gap:9px}
.cta svg{width:20px;height:20px;flex:none}
.cta:active{transform:scale(.985)}
.cta:disabled{opacity:.45;box-shadow:none}
.cta.ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--ink);box-shadow:none}
.cta.danger{background:var(--danger);color:var(--on-danger);box-shadow:none}
.stickycta{position:sticky;bottom:calc(16px + env(safe-area-inset-bottom));margin-top:18px}
/* Second line on the Pay button: the energy estimate stays visible even when the
   quote card below the amounts is covered by the pinned button on a small phone. */
.cta .cta-2l{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.cta .cta-2l small{font-size:12.5px;font-weight:600;opacity:.92;margin-top:2px}
.quote-line{scroll-margin-bottom:110px}

/* payment */
.qrwrap{background:#fff;border-radius:20px;padding:20px;margin:4px auto 0;width:min(78%,260px);
        box-shadow:var(--shadow);display:block}
.qrwrap img{width:100%;display:block}
.paylabel{text-align:center;margin-top:16px}
.paylabel .amt{font-family:var(--f-num);font-weight:800;font-size:30px;color:var(--ink);font-variant-numeric:tabular-nums}
.qris-badge{display:inline-flex;align-items:center;gap:7px;background:var(--raised);border:1px solid var(--line);
            border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:700;color:var(--body);margin-top:8px}
.qris-badge b{color:#e11}

/* live session — the moment that matters */
.live{padding-top:8px}
.ring-wrap{position:relative;width:230px;height:230px;margin:8px auto 4px}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-center .kwh{font-family:var(--f-num);font-weight:800;font-size:52px;color:var(--ink);line-height:.95;font-variant-numeric:tabular-nums}
.ring-center .kwh small{font-size:20px;color:var(--muted);font-weight:600}
.ring-center .st{margin-top:8px;font-size:13px;font-weight:700;color:var(--arus);display:flex;align-items:center;gap:7px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--arus);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.livestats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.lstat{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:13px 10px;text-align:center}
.lstat .v{font-family:var(--f-num);font-weight:700;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.lstat .k{font-size:11px;color:var(--muted);font-weight:600;margin-top:3px}
.costnote{margin-top:10px;font-size:12px;color:var(--muted);text-align:center}
.costnote .bits{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 6px}
.costnote .bits i{font-style:normal;opacity:.6}
.costnote .save{color:var(--arus);font-weight:600}
.costnote .idle{display:flex;gap:8px;align-items:flex-start;text-align:left;margin-top:10px;padding:10px 12px;border-radius:12px;
  background:var(--raised);border:1px solid var(--amber);color:var(--ink)}
.costnote .idle svg{flex:0 0 16px;width:16px;height:16px;color:var(--amber);margin-top:1px}

/* receipt */
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.rc-head{padding:20px;text-align:center;background:
   radial-gradient(80% 100% at 50% 0%, var(--arus-glow), transparent 70%);border-bottom:1px dashed var(--line-2)}
.rc-head .chk{width:52px;height:52px;border-radius:50%;background:var(--ok-soft);color:var(--ok);
              display:grid;place-items:center;margin:0 auto 10px}
.rc-head .chk svg{width:28px;height:28px}
.rc-total{font-family:var(--f-num);font-weight:800;font-size:32px;color:var(--ink);font-variant-numeric:tabular-nums}
.rc-body{padding:16px 18px}
.rc-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px}
.rc-line .d{color:var(--body)} .rc-line .q{color:var(--muted);font-size:12px}
.rc-line .a{font-family:var(--f-num);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.rc-sep{border-top:1px dashed var(--line-2);margin:8px 0}
.rc-line.tot .d{font-weight:700;color:var(--ink)} .rc-line.tot .a{font-weight:800;font-size:17px}
.rc-line.neg .a{color:var(--ok)}
.refund{margin:14px 18px 0;padding:13px 15px;border-radius:14px;background:var(--ok-soft);border:1px solid transparent;
        display:flex;align-items:center;gap:11px}
.refund svg{width:22px;height:22px;color:var(--ok);flex:none}
.refund .t{font-weight:700;color:var(--ink);font-size:14px}
.refund .s{font-size:12.5px;color:var(--body)}

/* history */
.hrow{display:flex;gap:13px;align-items:center;padding:14px;border-radius:15px;background:var(--surface);
      border:1px solid var(--line);width:100%;text-align:left;margin-bottom:9px}
.hrow .ic{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--raised-2);color:var(--arus)}
.hrow .ic svg{width:20px;height:20px}
.hrow .nm{font-weight:700;color:var(--ink);font-size:14.5px}
.hrow .mt{font-size:12px;color:var(--muted);margin-top:2px}
.hrow .rt{margin-left:auto;text-align:right;flex:none}
.hrow .rt .a{font-family:var(--f-num);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.hrow .rt .e{font-size:11.5px;color:var(--muted)}

/* account */
.field{margin-top:12px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px;padding-left:2px}
.field input{width:100%;padding:14px 15px;border-radius:13px;background:var(--surface);
             border:1.5px solid var(--line);color:var(--ink);font-size:16px;outline:none}
.field input:focus{border-color:var(--arus)}
.otp-in{letter-spacing:.5em;font-family:var(--f-num);font-weight:700;text-align:center;font-size:22px!important}
.accrow{display:flex;align-items:center;gap:13px;padding:15px;border-radius:15px;background:var(--surface);border:1px solid var(--line)}
.accrow .av{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,var(--arus),var(--arus-deep));
            color:var(--on-arus);display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:18px;flex:none}
.accrow .nm{font-weight:700;color:var(--ink);font-size:15.5px}
.accrow .ph{font-size:13px;color:var(--muted)}

.seg{display:flex;background:var(--raised);border:1px solid var(--line);border-radius:13px;padding:4px;margin-top:6px}
.seg button{flex:1;padding:12px 10px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}

/* bottom tab bar */
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;height:calc(var(--tab-h) + env(safe-area-inset-bottom));
      background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(12px);
      border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--arus)}
.tabhide .tabs{display:none}

/* wide (landscape tablet / desktop): station list left, the task right.
   Pure CSS on the same query the script uses (WIDE_MQ), so the layout follows
   the screen instantly on rotation even before any script runs. */
#side{display:none}
@media (min-width:900px) and (min-height:600px){
  #app{max-width:1120px;display:grid;grid-template-columns:minmax(320px,380px) minmax(0,1fr);
       margin-top:0;min-height:100vh;min-height:100dvh;border-radius:0;border-top:0}
  #side{display:block;position:sticky;top:0;align-self:start;height:100vh;height:100dvh;overflow-y:auto;
       overscroll-behavior:contain;padding:0 16px calc(24px + env(safe-area-inset-bottom));
       border-right:1px solid var(--line);background:var(--raised)}
  #view.view{padding:0 28px calc(32px + env(safe-area-inset-bottom));min-width:0}
  .tabs{display:none!important}
  #nearby-sec, #find{display:none}   /* the list is already on the left */
  /* the side column carries the language / theme toggles */
  #view .themetgl, #view .langtgl{display:none}
}
.side-head{display:flex;align-items:center;gap:10px;padding:calc(18px + env(safe-area-inset-top)) 2px 14px;
     position:sticky;top:0;z-index:2;background:linear-gradient(var(--raised) 75%, transparent)}
.side-head .sh-t{font-family:var(--f-num);font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-.02em}
.side-head .sh-s{font-size:12px;color:var(--muted)}
.side-head .spacer{flex:1}
.side-nav{display:flex;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:6px}
.side-nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 6px;border-radius:10px;
     font-weight:700;font-size:13px;color:var(--muted);min-height:42px}
.side-nav button svg{width:18px;height:18px}
.side-nav button.on{background:var(--surface);color:var(--arus);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.station.sel{border-color:var(--arus);background:var(--arus-glow)}
.station.sel .stnicon{background:var(--arus);color:var(--on-arus)}

/* toast / banners */
.banner{padding:13px 15px;border-radius:14px;font-size:13.5px;font-weight:600;margin:10px 0;display:flex;gap:10px;align-items:flex-start}
.banner svg{width:19px;height:19px;flex:none;margin-top:1px}
.b-warn{background:var(--amber-soft);color:var(--amber)}
.b-err{background:var(--danger-soft);color:var(--danger)}
.b-info{background:var(--arus-glow);color:var(--ink)}
.active-banner{margin:6px 0 0;padding:15px;border-radius:18px;background:linear-gradient(150deg,var(--arus-deep),var(--arus));
   color:var(--on-arus);display:flex;align-items:center;gap:13px;box-shadow:0 8px 24px var(--arus-glow)}
.active-banner .ab-k{font-size:12px;font-weight:700;opacity:.92}
.active-banner .ab-v{font-family:var(--f-num);font-weight:800;font-size:20px}
.active-banner svg{width:26px;height:26px}
.active-banner .go{margin-left:auto;background:color-mix(in srgb, var(--on-arus) 16%, transparent);border-radius:11px;padding:9px 13px;font-weight:700;font-size:13px}

/* scanner */
.scanview{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
.scanview video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-overlay{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.scan-frame{width:240px;height:240px;border-radius:28px;position:relative;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
.scan-frame::before,.scan-frame::after{content:"";position:absolute;width:36px;height:36px;border:3px solid var(--arus)}
.scan-frame::before{top:-2px;left:-2px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.scan-frame::after{bottom:-2px;right:-2px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.scan-hint{color:#fff;margin-top:26px;font-weight:600;font-size:14px;text-align:center;padding:0 30px;z-index:2}
.scan-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;z-index:3}
.scan-top button{background:rgba(0,0,0,.5);color:#fff;border-radius:12px;padding:13px 16px;font-weight:600;font-size:14px}
.scan-manual{position:absolute;bottom:0;left:0;right:0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));z-index:3;background:linear-gradient(transparent,rgba(0,0,0,.7))}

/* misc */
.center-empty{text-align:center;padding:50px 20px;color:var(--muted)}
.center-empty svg{width:54px;height:54px;color:var(--faint);margin-bottom:14px}
.spinner{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.25);border-top-color:var(--on-arus);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.cta.ghost .spinner,.center-loading .spinner{border-color:var(--line-2);border-top-color:var(--arus)}
@keyframes spin{to{transform:rotate(360deg)}}
.center-loading{display:flex;align-items:center;justify-content:center;padding:60px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.themetgl{width:42px;height:42px;border-radius:12px;background:var(--raised);display:grid;place-items:center;color:var(--ink)}
.themetgl svg{width:18px;height:18px}
.skel{background:linear-gradient(90deg,var(--raised) 25%,var(--raised-2) 50%,var(--raised) 75%);
      background-size:200% 100%;animation:sk 1.3s infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}
</style>

<body>
<div id="app">
  <aside id="side" aria-label="Stasiun"></aside>
  <main id="view" class="view"></main>
</div>
<nav class="tabs" id="tabs"></nav>

<style>
.langtgl{min-width:42px;height:42px;padding:0 10px;border-radius:12px;background:var(--raised);
  display:grid;place-items:center;color:var(--ink);font-family:var(--f-ui);font-weight:800;font-size:12.5px;letter-spacing:.03em}

[hidden]{display:none!important}
/* favourite star (top bar) */
.favbtn{width:42px;height:42px;border-radius:12px;background:var(--raised);display:grid;place-items:center;color:var(--muted);flex:none}
.favbtn svg{width:20px;height:20px}
.favbtn.on{color:var(--amber);background:var(--amber-soft)}

/* list / map switch on the Stations screen */
.seg.slim{margin:0 0 12px}
.seg.slim button{padding:9px 10px;display:flex;align-items:center;justify-content:center;gap:7px}
.seg.slim button svg{width:17px;height:17px}

/* station map — a small hand-built slippy map (OSM raster tiles), no library */
.map{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:var(--raised);
     height:calc(100dvh - 250px - env(safe-area-inset-bottom));min-height:340px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.map.dragging{cursor:grabbing}
.map .tiles,.map .marks{position:absolute;inset:0}
.map .tiles img{position:absolute;max-width:none;pointer-events:none;image-rendering:auto}
:root:not([data-theme="light"]) .map .tiles{filter:brightness(.72) contrast(1.08) saturate(.8)}
.map .attr{position:absolute;right:0;bottom:0;z-index:3;font-size:10.5px;padding:2px 7px;border-top-left-radius:8px;
     background:color-mix(in srgb, var(--surface) 85%, transparent);color:var(--muted)}
.map .attr a{color:inherit}
.map .ctl{position:absolute;right:10px;top:10px;z-index:3;display:flex;flex-direction:column;gap:6px}
.map .ctl button{width:40px;height:40px;border-radius:11px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);
     font-size:20px;font-weight:700;display:grid;place-items:center;box-shadow:var(--shadow)}
.map .ctl button svg{width:18px;height:18px}
.mk{position:absolute;transform:translate(-50%,-100%);z-index:2;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.mk .b{min-width:30px;height:30px;padding:0 7px;border-radius:15px;display:grid;place-items:center;font-family:var(--f-num);
     font-weight:800;font-size:13px;border:2px solid var(--surface);box-shadow:0 3px 10px rgba(0,0,0,.35);
     background:var(--raised-2);color:var(--muted)}
.mk .b svg{width:15px;height:15px}
.mk .t{width:2px;height:8px;background:var(--surface)}
.mk.ok .b{background:var(--ok);color:#04231d}
.mk.partner .b{background:var(--sky);color:#04202c}
.mk.partner.full .b{background:var(--raised-2);color:var(--sky)}
.mk.sel .b{outline:3px solid var(--arus);outline-offset:1px}
.mk.me{transform:translate(-50%,-50%);cursor:default}
.mk.me .b{min-width:16px;width:16px;height:16px;padding:0;border-radius:50%;background:#2f7ff0;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,127,240,.25)}
/* a group of stations too close to tell apart at this zoom: a round bubble with the count */
.mk.cl{transform:translate(-50%,-50%)}
.mk.cl .b{min-width:40px;height:40px;border-radius:20px;font-size:14.5px;border-width:3px;box-shadow:0 0 0 5px rgba(0,0,0,.14),0 3px 10px rgba(0,0,0,.35)}
.mapcard .clist{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:2px}
.maplegend i.lg-cl{width:15px;height:15px;border:2px solid var(--surface);box-shadow:0 0 0 2px var(--ok)}
.mapcard{position:absolute;left:10px;right:10px;bottom:22px;z-index:4}
.mapcard .station{margin:0;box-shadow:var(--shadow)}
.maplegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 4px 0}
.maplegend span{display:inline-flex;align-items:center;gap:6px}
.maplegend i{width:11px;height:11px;border-radius:50%;display:inline-block}

/* reservation */
.rescard{margin:10px 0 0;padding:14px 15px;border-radius:18px;background:var(--surface);border:1.5px solid var(--arus);
     display:flex;gap:12px;align-items:center}
.rescard .ic{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--arus-glow);color:var(--arus)}
.rescard .ic svg{width:21px;height:21px}
.rescard .k{font-size:12px;font-weight:700;color:var(--arus)}
.rescard .v{font-weight:700;color:var(--ink);font-size:15px;line-height:1.25}
.rescard .s{font-size:12.5px;color:var(--muted)}
.rescard .cd{font-family:var(--f-num);font-weight:800;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:auto;flex:none}
.resrow{display:flex;gap:10px;margin-top:8px}
.resrow .cta{padding:12px;font-size:14px}

/* settings row with a switch (notifications) */
.setrow{display:flex;align-items:center;gap:12px;padding:14px 15px;border-radius:15px;background:var(--surface);border:1px solid var(--line);margin-top:12px}
.setrow .ic{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--raised-2);color:var(--arus)}
.setrow .ic svg{width:19px;height:19px}
.setrow .t{font-weight:700;color:var(--ink);font-size:14.5px}
.setrow .s{font-size:12.5px;color:var(--muted)}
.switch{margin-left:auto;flex:none;width:50px;height:30px;border-radius:15px;background:var(--line-2);position:relative;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--arus)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.switch:disabled{opacity:.45}
/* promo code and member perks at checkout; membership cards */
.promo-in span svg{width:18px;height:18px;color:var(--arus);display:block}
.promo-in input{font-family:var(--f-ui);font-size:15px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.quote-line .perk{color:var(--arus);font-weight:700}
.plan{padding:14px 15px;border-radius:15px;background:var(--surface);border:1px solid var(--line);margin-top:10px}
.plan .nm{font-weight:700;color:var(--ink);font-size:15px}
.plan .op{font-size:12px;color:var(--muted)}
.plan .perks{font-size:13px;color:var(--body);margin-top:6px}
.plan .price{font-family:var(--f-num);font-weight:800;color:var(--ink);font-size:18px}
.plan.mine{border-color:var(--arus);background:linear-gradient(160deg,var(--arus-glow),var(--surface) 60%)}
.meter{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden;margin-top:8px}
.meter>i{display:block;height:100%;background:var(--arus)}
/* payment method: QRIS, e-wallets, card */
.methods{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:6px}
.method{padding:11px 4px;border-radius:13px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);
        font-family:var(--f-ui);font-weight:700;font-size:13.5px;text-align:center;line-height:1.2;transition:.12s}
.method small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);margin-top:3px;letter-spacing:.02em}
.method.sel{border-color:var(--arus);background:var(--arus-glow)}
.method.sel small{color:var(--arus-deep)}
.paymark{width:78px;height:78px;border-radius:22px;margin:10px auto 0;display:grid;place-items:center;
         background:var(--arus-glow);color:var(--arus-deep);font-family:var(--f-num);font-weight:800;font-size:20px;letter-spacing:.02em}
.paymark svg{width:34px;height:34px}
.savecard{display:flex;gap:9px;align-items:center;margin-top:10px;font-size:13.5px;color:var(--body);cursor:pointer}
.savecard input{width:18px;height:18px;accent-color:var(--arus);flex:none}
.linkwallet{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;width:100%;border-radius:12px;border:1.5px dashed var(--line-2);background:transparent;color:var(--arus);font-family:var(--f-ui);font-weight:700;font-size:13.5px}
.linkwallet svg{width:18px;height:18px;flex:none}
/* a white-label app's help and legal links (Account) */
.helprow{display:flex;align-items:center;gap:10px;padding:10px 2px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.helprow+.helprow{border-top:1px solid var(--line)}
.helprow svg{width:18px;height:18px;flex:none;color:var(--arus)}
</style>

  function tText(node){
    var raw=node.nodeValue; if(!raw) return; var key=raw.trim(); if(!key) return;
    if(DICT[key]!==undefined){ if(key!==DICT[key]) node.nodeValue=raw.replace(key,DICT[key]); return; }
    var v=raw, ch=false;
    for(var i=0;i<PATTERNS.length;i++){ if(PATTERNS[i][0].test(v)){ v=v.replace(PATTERNS[i][0],PATTERNS[i][1]); ch=true; } }
    if(ch) node.nodeValue=v;
  }
  function tTree(root){
    if(!root) return;
    if(root.nodeType===3){ tText(root); return; }
    if(root.nodeType!==1) return;
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), n, arr=[];
    while((n=w.nextNode())) arr.push(n);
    arr.forEach(tText);
    var els=root.querySelectorAll?root.querySelectorAll('[placeholder],[aria-label]'):[];
    Array.prototype.forEach.call(els,function(el){
      ['placeholder','aria-label'].forEach(function(a){ var val=el.getAttribute(a); if(val&&DICT[val.trim()]!==undefined) el.setAttribute(a,DICT[val.trim()]); });
    });
  }
  var obs=null;
  function connect(){
    if(obs) return;
    obs=new MutationObserver(function(recs){
      if(window.LANG!=='en') return;
      obs.disconnect();
      for(var i=0;i<recs.length;i++){ var m=recs[i];
        for(var j=0;j<m.addedNodes.length;j++) tTree(m.addedNodes[j]);
      }
      obs.takeRecords(); observe();
    });
    observe();
  }
  function observe(){ if(document.body) obs.observe(document.body,{childList:true,subtree:true}); }
  window.tstr=function(s){ if(window.LANG!=='en'||s==null) return s; if(DICT[s]!==undefined) return DICT[s];
    var v=String(s); for(var i=0;i<PATTERNS.length;i++){ if(PATTERNS[i][0].test(v)) v=v.replace(PATTERNS[i][0],PATTERNS[i][1]); } return v; };
  window.setLang=function(l){
    window.LANG=l; try{ localStorage.setItem('ps_lang',l); document.documentElement.lang=l; }catch(e){}
    if(typeof render==='function') render();      // rebuild Indonesian DOM; observer re-translates if 'en'
  };
  function boot(){ connect(); if(window.LANG==='en') tTree(document.body); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ setTimeout(boot,0); });
  else setTimeout(boot,0);
})();
</script>

    const ok=await NATIVE_PUSH.addListener('registration',(r)=>{ clearTimeout(t); ok.remove&&ok.remove(); resolve(r.value); });
    const bad=await NATIVE_PUSH.addListener('registrationError',(e)=>{ clearTimeout(t); bad.remove&&bad.remove(); reject(new Error('Notifikasi iOS gagal didaftarkan.')); });

}
/**

    return LIVE_ACT.start({ chargeId:s.chargeId, site:s.siteName||'', connector:s.connectorLabel||'', appName:window.BRAND.name, accent:window.BRAND.accent||'#2fd6a7',

function pushSupported(){ if(NATIVE_PUSH) return true; return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && !!(state.meta&&state.meta.push&&state.meta.push.publicKey); }
/** 'unsupported' | 'denied' | 'on' | 'off' */
async function pushState(){
  if(NATIVE_PUSH){
    try{ const p=await NATIVE_PUSH.checkPermissions(); if(p.receive==='denied') return 'denied';
      if(p.receive!=='granted'||!LS.getItem(APNS_LS)) return 'off';
      const {subscribed}=await api('/v1/push'); return subscribed?'on':'off'; }catch(e){ return 'off'; }
  }
  if(!pushSupported()) return 'unsupported';
  if(Notification.permission==='denied') return 'denied';
  try{ const reg=await navigator.serviceWorker.getRegistration(); const sub=reg&&await reg.pushManager.getSubscription();
    if(!sub) return 'off';
    const {subscribed}=await api('/v1/push'); return subscribed?'on':'off'; }catch(e){ return 'off'; }
}
async function enablePush(){
  if(NATIVE_PUSH){
    let p=await NATIVE_PUSH.checkPermissions();
    if(p.receive!=='granted') p=await NATIVE_PUSH.requestPermissions();
    if(p.receive!=='granted') throw new Error('Izin notifikasi ditolak. Izinkan di Pengaturan iPhone.');
    await nativeRegister(); return;
  }
  if(!pushSupported()) throw new Error('Notifikasi tidak didukung di browser ini.');
  const perm=await Notification.requestPermission();
  if(perm!=='granted') throw new Error('Izin notifikasi ditolak. Izinkan di pengaturan browser.');
  const reg=await navigator.serviceWorker.ready;
  const key=b64uBytes(state.meta.push.publicKey);

  // A subscription made for an older server key cannot be reused.
  if(sub&&sub.options&&sub.options.applicationServerKey){ const old=new Uint8Array(sub.options.applicationServerKey); if(old.length!==key.length||old.some((v,i)=>v!==key[i])){ await sub.unsubscribe(); sub=null; } }
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
  await api('/v1/push/subscribe',{method:'POST',body:JSON.stringify({subscription:sub.toJSON(),lang:window.LANG})});
}

  if(NATIVE_PUSH){
    const token=LS.getItem(APNS_LS);
    if(token) await api('/v1/push/apns/remove',{method:'POST',body:JSON.stringify({token})}).catch(()=>{});
    try{ LS.removeItem(APNS_LS); await NATIVE_PUSH.unregister(); }catch(e){}

  }
  const reg=await navigator.serviceWorker.getRegistration(); const sub=reg&&await reg.pushManager.getSubscription();

const mmss=(ms)=>{ const s=Math.max(0,Math.round(ms/1000)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const hhmm=(iso)=>new Date(iso).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});

//────────────────────────────────────────────────────────── station map
/**
 * A small slippy map: raster tiles (MAP_TILE_URL, OpenStreetMap by default),
 * drag / wheel / pinch / double-tap, markers and a locate button. Positions are
 * kept as Web-Mercator fractions (0..1) and a fractional zoom, so every gesture
 * is the same arithmetic.
 */
// map-cluster:start
/**
 * Group map markers that would sit closer than `radius` screen pixels at `scale`
 * (256·2^zoom): grid buckets of the radius, the first marker in a spot seeds its
 * group, so it is one pass over the stations however many there are. Each group
 * is placed at the mean of its members. radius 0 = no grouping.
 */
function clusterPoints(pts,scale,radius){
  if(!(radius>0)) return pts.map((p,i)=>({members:[i],x:p._x,y:p._y}));
  const cells=new Map(), groups=[];
  for(let i=0;i<pts.length;i++){
    const px=pts[i]._x*scale, py=pts[i]._y*scale, gx=Math.floor(px/radius), gy=Math.floor(py/radius);
    let hit=null;
    for(let dx=-1;dx<=1&&!hit;dx++) for(let dy=-1;dy<=1&&!hit;dy++){
      const list=cells.get((gx+dx)+','+(gy+dy)); if(!list) continue;
      for(const g of list){ if(Math.hypot(g.px-px,g.py-py)<=radius){ hit=g; break; } }
    }
    if(hit) hit.members.push(i);
    else { const g={members:[i],px,py}; groups.push(g); const k=gx+','+gy; if(!cells.has(k)) cells.set(k,[]); cells.get(k).push(g); }
  }
  return groups.map(g=>{ let x=0,y=0; for(const i of g.members){ x+=pts[i]._x; y+=pts[i]._y; } return {members:g.members,x:x/g.members.length,y:y/g.members.length}; });
}
// map-cluster:end
function mercX(lon){ return (lon+180)/360; }
function mercY(lat){ const s=Math.sin(Math.max(-85,Math.min(85,lat))*Math.PI/180); return .5-Math.log((1+s)/(1-s))/(4*Math.PI); }
function makeMap(box,cfg,points,opts={}){
  const T=256, maxZ=Math.min(19,cfg.maxZoom||19), minZ=3;

    <div class="ctl"><button data-z="1" aria-label="Perbesar">+</button><button data-z="-1" aria-label="Perkecil">−</button><button data-loc aria-label="Lokasi saya">${svg(I.locate)}</button></div>
    <div class="attr">${esc(cfg.attribution||'')}</div><div class="mapcard" hidden></div>`;
  const tilesEl=$('.tiles',box), marksEl=$('.marks',box), card=$('.mapcard',box);
  const cache=new Map();

  const W=()=>box.clientWidth, H=()=>box.clientHeight;

      const wx=((tx%n)+n)%n, key=tz+'/'+wx+'/'+ty+'/'+tx; used.add(key);
      let img=cache.get(key);
      if(!img){ img=new Image(); img.alt=''; img.decoding='async'; img.src=tileUrl(tz,wx,ty); cache.set(key,img); tilesEl.appendChild(img); }
      img.style.cssText=`left:${Math.round(tx*size-cx+w/2)}px;top:${Math.round(ty*size-cy+h/2)}px;width:${Math.ceil(size)+1}px;height:${Math.ceil(size)+1}px`;

  }
  function select(i){
    sel=i; marksEl.querySelectorAll('[data-i]').forEach(m=>m.classList.toggle('sel',Number(m.dataset.i)===i));

      (members.length>10?`<div class="card small muted" style="margin-top:8px;text-align:center;box-shadow:var(--shadow)">${members.length-10} stasiun lain di sini · lihat Daftar</div>`:''); card.hidden=false;

        return `<button class="mk ${p.partner?'partner':''} ${p.availableCount>0?'ok':'full'}${sel===i?' sel':''}" data-k="${k}" data-i="${i}" aria-label="${esc(p.name)}">
          <span class="b">${p.partner?svg(I.globe):p.availableCount>0?p.availableCount:svg(I.plug)}</span><span class="t"></span></button>`; }
      const ms=g.members.map(i=>points[i]), own=ms.filter(p=>!p.partner);
      const cls=own.some(p=>p.availableCount>0)?'ok':own.length?'full':ms.some(p=>p.availableCount>0)?'partner':'partner full';
      return `<button class="mk cl ${cls}" data-k="${k}" aria-label="${g.members.length} stasiun"><span class="b">${g.members.length}</span></button>`;
    }).join('')+`<div class="mk me" ${me?'':'hidden'}><span class="b"></span></div>`;
    marksEl.querySelectorAll('[data-k]').forEach(m=>{ m.onpointerdown=(e)=>e.stopPropagation();
      m.onclick=(e)=>{ e.stopPropagation(); haptic(); const g=groups[Number(m.dataset.k)]; if(g.members.length===1) select(g.members[0]); else openGroup(g); }; });
  }
  points.forEach(p=>{ p._x=mercX(p.lon); p._y=mercY(p.lat); });
  // gestures
  const ptrs=new Map(); let start=null, moved=false, lastTap=0;
  box.addEventListener('pointerdown',(e)=>{
    if(e.target.closest('.ctl,.mapcard,.attr')) return;
    box.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false;
    start={mx,my,z,pts:[...ptrs.values()].map(p=>({...p}))}; box.classList.add('dragging');
  });
  box.addEventListener('pointermove',(e)=>{
    if(!ptrs.has(e.pointerId)||!start) return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const cur=[...ptrs.values()], r=box.getBoundingClientRect();
    if(cur.length===1&&start.pts.length===1){
      const dx=cur[0].x-start.pts[0].x, dy=cur[0].y-start.pts[0].y; if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
      const a=T*Math.pow(2,z); mx=start.mx-dx/a; my=start.my-dy/a; clampY(); draw();
    } else if(cur.length>=2&&start.pts.length>=2){
      moved=true;
      const d0=Math.hypot(start.pts[0].x-start.pts[1].x,start.pts[0].y-start.pts[1].y)||1, d1=Math.hypot(cur[0].x-cur[1].x,cur[0].y-cur[1].y)||1;
      mx=start.mx; my=start.my; z=start.z;
      const px=(start.pts[0].x+start.pts[1].x)/2-r.left, py=(start.pts[0].y+start.pts[1].y)/2-r.top;
      zoomAt(start.z+Math.log2(d1/d0),px,py);
      // follow the fingers' midpoint too
      const a=T*Math.pow(2,z); mx-=(((cur[0].x+cur[1].x)/2-r.left)-px)/a; my-=(((cur[0].y+cur[1].y)/2-r.top)-py)/a; clampY(); draw();
    }
  });
  const end=(e)=>{
    if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
    if(ptrs.size===0){ box.classList.remove('dragging');
      if(!moved){ const now=Date.now(), r=box.getBoundingClientRect();
        if(now-lastTap<300){ zoomAt(Math.round(z)+1,e.clientX-r.left,e.clientY-r.top); lastTap=0; } else { lastTap=now; select(null); } }
      // pinch ends on a whole zoom level, so tiles stay crisp
      else if(Math.abs(z-Math.round(z))>0.001){ const r=box.getBoundingClientRect(); zoomAt(Math.round(z),r.width/2,r.height/2); }
      start=null;
    } else { start={mx,my,z,pts:[...ptrs.values()].map(p=>({...p}))}; }
  };
  box.addEventListener('pointerup',end); box.addEventListener('pointercancel',end);
  box.addEventListener('wheel',(e)=>{ e.preventDefault(); const r=box.getBoundingClientRect(); zoomAt(Math.round(z)+(e.deltaY<0?1:-1),e.clientX-r.left,e.clientY-r.top); },{passive:false});
  box.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{ haptic(); zoomAt(Math.round(z)+Number(b.dataset.z),W()/2,H()/2); });
  $('[data-loc]',box).onclick=()=>{ haptic();
    if(!navigator.geolocation) return alertBanner('Lokasi tidak tersedia di perangkat ini.');
    navigator.geolocation.getCurrentPosition(p=>{ me={lat:p.coords.latitude,lon:p.coords.longitude}; $('.mk.me',marksEl).hidden=false;
      mx=mercX(me.lon); my=mercY(me.lat); z=Math.max(z,14); draw(); },()=>alertBanner('Lokasi tidak tersedia di perangkat ini.'),{timeout:6000}); };
  const ro=new ResizeObserver(()=>draw()); ro.observe(box);
  // first view: every station (and the driver) in frame
  requestAnimationFrame(()=>{ const pts=points.slice(); if(me) pts.push({_x:mercX(me.lon),_y:mercY(me.lat)});
    if(pts.length===1){ mx=pts[0]._x; my=pts[0]._y; z=15; draw(); } else if(pts.length) fit(pts); else draw(); });
  return { select, destroy(){ ro.disconnect(); } };
}

/**
 * Deep links: #c/<code> (a charger's QR), and the links in push notifications:
 * #s/<chargeId> (a charge here), #rr/<cdrId> (a partner network bill), #home, #history,
 * #paid (back from an e-wallet / card payment).
 * Returns true when the hash was a route.
 */
const UUIDISH=/^[0-9a-f-]{36}$/i;
function handleHash(){
  const h=location.hash.slice(1);
  const clear=()=>history.replaceState(null,'',location.pathname+location.search);
  if(h.startsWith('c/')){ clear(); resolveAndOpen(decodeURIComponent(h.slice(2))); return true; }
  if(h.startsWith('r/')&&UUIDISH.test(h.slice(2))){ clear(); go('receipt',{chargeId:h.slice(2),_back:()=>go('home')}); return true; }
  if(h.startsWith('s/')&&UUIDISH.test(h.slice(2))){ clear(); go('session',{chargeId:h.slice(2),_back:()=>go('home')}); return true; }
  if(h.startsWith('rr/')&&UUIDISH.test(h.slice(3))){ clear(); go('rreceipt',{cdrId:h.slice(3),_back:()=>go('history')}); return true; }
  if(h==='home'||h==='history'||h==='account'){ clear(); go(h); return true; }
  // Back from an e-wallet app or the card page (paid.html): the payment screen it left.
  if(h==='paid'){ clear(); if(!resumeCheckout()) go('home'); return true; }
  return false;
}
// A tapped notification when the app is open but the worker could not navigate it.
if('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message',(e)=>{
  const u=e.data&&e.data.type==='open'&&typeof e.data.url==='string'?e.data.url:''; const i=u.indexOf('#');
  if(i>=0){ location.hash=u.slice(i); }
});

/** A queue place ended while the app was closed: say why, once. */
const QUEUE_ENDED={missed:['Giliran Anda terlewat','Konektor diberikan ke pengemudi berikutnya karena tidak dipakai tepat waktu.'],
  expired:['Antrean berakhir','Batas waktu menunggu habis.'],removed:['Dikeluarkan dari antrean','Operator mengeluarkan Anda dari antrean.']};
const seenQueueEnd=(id)=>{ try{ return sessionStorage.getItem('qend')===id; }catch(e){ return false; } };
const markQueueEnd=(id)=>{ try{ sessionStorage.setItem('qend',id); }catch(e){} };

/** The driver's place in a site queue, on Home; checked again every 15 s while waiting. */
async function loadQueue(slot){
  try{
    const {entry:e,ended}=await api('/v1/queue'); if(!slot.isConnected) return;
    if(!e){
      const why=ended&&(ended.endReason==='queue closed'?['Antrean ditutup','Lokasi ini tidak memakai antrean lagi.']:QUEUE_ENDED[ended.state]);
      if(!why||seenQueueEnd(ended.id)){ slot.innerHTML=''; return; }
      slot.innerHTML=`<div class="rescard" style="border-color:var(--amber)"><div class="ic">${svg(I.info)}</div>
          <div style="flex:1;min-width:0"><div class="k">${why[0]}</div><div class="v">${esc(ended.siteName)}</div><div class="s">${why[1]}</div></div>
          <button class="cta ghost" id="qendok" style="width:auto;padding:0 16px;flex:none">OK</button></div>`;
      $('#qendok').onclick=()=>{ markQueueEnd(ended.id); slot.innerHTML=''; };
      return;
    }
    if(e.state==='offered'){ slot.innerHTML=''; return; } // the reservation card above shows the offer
    slot.innerHTML=queueCard(e);
    $('#qleave').onclick=()=>leaveQueue(e.id,()=>go('home'));
    setTimeout(async()=>{
      if(!slot.isConnected) return;
      try{ const {entry:n}=await api('/v1/queue'); if(!slot.isConnected) return; if(!n||n.state!=='waiting') go('home'); else loadQueue(slot); }catch(err){}
    },15000);
  }catch(err){}
}
function queueCard(e){
  return `<div class="rescard"><div class="ic">${svg(I.queue)}</div>
      <div style="flex:1;min-width:0"><div class="k">Anda dalam antrean</div><div class="v">${esc(e.siteName)}</div>
        <div class="s"><span>Ke-${e.position||1} dalam antrean</span> · <span>${e.waiting} menunggu</span></div>
        <div class="s"><span>Waktu mulai: ${e.offerMinutes} menit</span> · <span>Antre paling lama sampai ${hhmm(e.leaveBy)}</span></div></div></div>
    <div class="small muted" style="margin-top:6px">Saat konektor yang cocok kosong, charger menahannya untuk pengemudi pertama di antrean.</div>
    <button class="cta ghost" id="qleave" style="margin-top:8px">Keluar antrean</button>`;
}

  box.innerHTML=`<div class="seclabel">Antrean</div>

      ${q.reason&&!q.canJoin?`<div class="muted" style="margin-top:6px">${esc(q.reason)}</div>`:''}</div>
    ${q.canJoin?chips+`<button class="cta ghost" id="qjoin" style="margin-top:10px">${svg(I.queue)} Gabung antrean</button>
      <div class="small muted" style="text-align:center;margin-top:6px">Saat konektor yang cocok kosong, charger menahannya untuk pengemudi pertama di antrean.</div>`:''}`;
  box.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ pick=b.dataset.q; box.querySelectorAll('[data-q]').forEach(x=>x.classList.toggle('sel',x===b)); });
  const j=$('#qjoin'); if(!j) return;
  j.onclick=async()=>{ haptic(); j.disabled=true;
    const [current,type]=pick?pick.split('|'):[null,null];
    try{ await api('/v1/queue',{method:'POST',body:JSON.stringify({siteId,current,type})}); alertBanner('Anda masuk antrean.'); back(); }
    catch(e){ alertBanner(e.message); j.disabled=false; } };
}

/** Favourite stations on Home: ours and (for a fleet card that roams) partners'. */
async function loadFavourites(){
  const sec=$('#fav-sec'), box=$('#favs'); if(!sec) return;
  const favs=await loadFavs(); if(!favs.length||!sec.isConnected) return;
  sec.hidden=false; box.innerHTML=`<div class="skel" style="height:76px"></div>`;
  try{
    const [{stations},roam]=await Promise.all([api('/v1/stations'),favs.some(f=>!f.siteId)?fetchRoaming(null):Promise.resolve([])]);
    const own=stations.filter(s=>favOf({siteId:s.siteId}));
    const partner=roam.filter(s=>favOf(s));
    if(!own.length&&!partner.length){ sec.hidden=true; return; }
    box.innerHTML=own.map(stationRow).join('')+partner.map(roamRow).join('');
    box.querySelectorAll('[data-stn]').forEach(b=>b.onclick=()=>{ haptic(); state._station=own.find(s=>s.siteId===b.dataset.stn); go('station',{siteId:b.dataset.stn,_back:()=>go('home')}); });
    // roamRow numbers rows by their index in the list it was given
    box.querySelectorAll('[data-rstn]').forEach(b=>b.onclick=()=>{ haptic(); state._rstation=partner[Number(b.dataset.rstn)]; go('rstation',{_back:()=>go('home')}); });
  }catch(e){ sec.hidden=true; }
}

async function loadActive(slot){
  try{
    const {charges}=await api('/v1/history');

    slot.innerHTML=`<button class="active-banner" id="ab">${svg(I.bolt)}

      <span class="go">Lihat →</span></button>`;

async function loadNearby(box){
  box.innerHTML=`<div class="skel" style="height:76px;margin-bottom:10px"></div><div class="skel" style="height:76px"></div>`;
  let loc=null;
  await new Promise(res=>{
    if(!navigator.geolocation)return res();
    const t=setTimeout(res,2500);
    navigator.geolocation.getCurrentPosition(p=>{clearTimeout(t);loc={lat:p.coords.latitude,lon:p.coords.longitude};res();},()=>{clearTimeout(t);res();},{timeout:2400});
  });
  try{
    const q=loc?`?lat=${loc.lat}&lon=${loc.lon}`:'';
    const {stations}=await api('/v1/stations'+q);
    box.innerHTML=stations.slice(0,3).map(stationRow).join('')||'<div class="center-empty muted small">Belum ada stasiun.</div>';
    box.querySelectorAll('[data-stn]').forEach(b=>b.onclick=()=>openStation(b.dataset.stn,stations));
  }catch(e){ box.innerHTML=`<div class="banner b-err">${svg(I.warn)}<div>Gagal memuat stasiun.</div></div>`; }
}

function stationRow(s){
  const av=s.availableCount>0;
  const initials=s.name.replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'PS';
  return `<button class="station" data-stn="${s.siteId}">
    <div class="stnicon">${esc(initials)}</div>
    <div style="min-width:0;flex:1">
      <div class="nm">${esc(s.name)}</div>
      <div class="meta">
        <span class="avail ${av?'av-yes':'av-no'}"><span class="ind"></span>${av?s.availableCount+' tersedia':'Penuh'}</span>
        <span class="dot"></span><b>${esc(s.fastest)}</b>
        ${s.distanceKm!=null?`<span class="dot"></span>${s.distanceKm} km`:''}
      </div>
    </div>
    ${s.priceFromIdr!=null?`<div class="pricetag"><div class="p">${rp(s.priceFromIdr)}</div><div class="u">/kWh</div></div>`:''}
  </button>`;
}

/** List | Map switch (the phone layout; wide screens have the list on the left). */
function stnSeg(on){

}
function wireStnSeg(){ const s=$('#stnseg'); if(!s) return;

  const q=loc?`?lat=${loc.lat}&lon=${loc.lon}`:'';

  });

};

  state._station=s; go('station',{siteId,_back:()=>go('stations')});
}

//──────────── ROAMING (fleet card on a partner operator's charger)
const RSTATUS_LABEL={Available:'Tersedia',Charging:'Dipakai',Occupied:'Disiapkan',Offline:'Luring',Faulted:'Bermasalah',Maintenance:'Perawatan',Unavailable:'Tidak tersedia'};
const rstatusCls=(s)=>s==='Available'?'sp-ok':s==='Charging'||s==='Occupied'?'sp-busy':s==='Faulted'||s==='Maintenance'?'sp-block':'sp-off';
VIEWS.rstation=async(v)=>{
  const s=state._rstation; if(!s){return go('stations');}
  v.className='view';
  v.innerHTML=topbar(s.name,s.operator,{back:1,right:favBtnHtml(s)})+
    `${s.address?`<div class="card soft small muted" style="display:flex;gap:9px;align-items:flex-start">${svg(I.pin,'')}<div>${esc(s.address)}</div></div>`:''}
     <div class="banner b-info">${svg(I.fleet)}<div><div>Charger mitra. Sesi ditagihkan ke perusahaan Anda sesuai tarif operator.</div>
       ${s.priceFromIdr!=null?`<div class="small" style="margin-top:4px">Energi <b>${rp(s.priceFromIdr)}</b> <span>/kWh, belum termasuk pajak</span></div>`:''}</div></div>
     <div class="seclabel">Charger</div>
     <div id="revs"></div>`;
  const box=$('#revs');
  // The driver's partner reservation, if it is at this location: that EVSE is theirs to start.
  let held=null; try{ const r=await api('/v1/reservation'); held=r.partner&&r.partner.locationId===s.locationId&&r.partner.partnerId===s.partnerId?r.partner:null; }catch(e){}
  const canReserve=!!(state.meta&&state.meta.reservations&&state.meta.reservations.enabled);
  const mins=(state.meta&&state.meta.reservations&&state.meta.reservations.minutes)||15;
  box.innerHTML=s.evses.map((e,i)=>{
    const c=e.connectors[0]||{};
    const mine=held&&held.evseUid===e.uid;
    return `<div class="station" style="cursor:default;flex-wrap:wrap">
      <div class="stnicon">${svg(c.current==='DC'?I.dc:I.ac)}</div>
      <div style="flex:1;min-width:0">
        <div class="nm">${esc(c.typeLabel||'—')}${c.maxPowerKw!=null?` · ${c.maxPowerKw} kW ${c.current}`:''}</div>
        <div class="meta">${mine?`<span class="statuspill sp-ok">Dipesan untuk Anda</span>`:`<span class="statuspill ${rstatusCls(e.status)}">${RSTATUS_LABEL[e.status]||e.status}</span>`}<span class="small muted" style="margin-left:8px">${esc(e.evseId)}</span></div>
      </div>
      ${e.available||mine?`<button class="cta" style="width:auto;padding:10px 14px;min-height:0" data-rstart="${i}">${svg(I.bolt)} Mulai isi</button>`:''}
      ${mine?`<div class="resrow" style="width:100%"><div class="small muted" style="flex:1;align-self:center">${held.state==='requested'?'Menunggu jawaban charger…':`<span>Mulai isi sebelum ${hhmm(held.expiresAt)}</span>`}</div>
          <button class="cta ghost" style="width:auto;padding:8px 14px;min-height:0" data-rcancel>Batalkan</button></div>`
        :e.available&&canReserve&&!held?`<div style="width:100%;margin-top:8px"><button class="cta ghost" style="padding:8px 14px;min-height:0" data-rreserve="${i}">${svg(I.hold)} Pesan ${mins} menit</button></div>`:''}
    </div>`;}).join('')||`<div class="center-empty small">Belum ada charger.</div>`;
  box.querySelectorAll('[data-rreserve]').forEach(b=>b.onclick=async()=>{
    haptic(); const e=s.evses[Number(b.dataset.rreserve)]; b.disabled=true; b.innerHTML='<span class="spinner"></span>';
    try{
      const r=await api('/v1/roaming/reservations',{method:'POST',body:JSON.stringify({partnerId:s.partnerId,countryCode:s.countryCode,partyId:s.partyId,locationId:s.locationId,evseUid:e.uid})});
      // The operator took the request; the charger's own answer follows (usually within seconds).
      let res=r.reservation;
      for(let n=0;n<20&&res&&res.state==='requested';n++){ await new Promise(x=>setTimeout(x,1000)); try{ res=(await api('/v1/roaming/reservations/'+res.id)).reservation; }catch(err){ break; } }
      if(res&&res.state==='rejected') alertBanner(res.problem||'Charger menolak reservasi.');
      else alertBanner('Charger mitra dipesan.');
      go('rstation',{...state.params});
    }catch(err){ alertBanner(err.message); b.disabled=false; b.innerHTML=svg(I.hold)+` Pesan ${mins} menit`; }
  });
  const rc=box.querySelector('[data-rcancel]');
  if(rc) rc.onclick=async()=>{ haptic(); rc.disabled=true;
    try{ await api('/v1/roaming/reservations/'+held.id+'/cancel',{method:'POST'}); alertBanner('Reservasi dibatalkan.'); go('rstation',{...state.params}); }
    catch(err){ alertBanner(err.message); rc.disabled=false; } };
  box.querySelectorAll('[data-rstart]').forEach(b=>b.onclick=async()=>{
    haptic(); const e=s.evses[Number(b.dataset.rstart)]; b.disabled=true; b.innerHTML='<span class="spinner"></span>';
    try{ const r=await api('/v1/roaming/charge',{method:'POST',body:JSON.stringify({partnerId:s.partnerId,countryCode:s.countryCode,partyId:s.partyId,locationId:s.locationId,evseUid:e.uid,connectorId:(e.connectors[0]||{}).id})});
      go('rsession',{chargeId:r.chargeId,_back:()=>go('home')});
    }catch(err){ alertBanner(err.message); b.disabled=false; b.innerHTML=svg(I.bolt)+' Mulai isi'; }
  });
  wireFav(s);
};

VIEWS.rsession=async(v)=>{
  v.className='view full';
  const id=state.params.chargeId;
  v.innerHTML=topbar('Sesi di jaringan mitra','',{back:1})+`<div id="live"><div class="center-loading"><span class="spinner"></span></div></div>`;
  const paint=(s)=>{
    const live=$('#live'); if(!live)return;
    const label={starting:'Menghubungi charger…',rejected:'Tidak dapat dimulai',charging:'Sedang mengisi',finishing:'Menunggu tagihan operator…',billed:'Selesai'}[s.state]||s.state;
    const active=s.state==='charging';
    const R=104, C=2*Math.PI*R, off=s.state==='billed'?0:C*0.0001;
    live.innerHTML=`
      <div class="live">
        <div class="ring-wrap">
          <svg viewBox="0 0 240 240" style="transform:rotate(-90deg)">
            <circle cx="120" cy="120" r="${R}" fill="none" stroke="var(--line-2)" stroke-width="14"/>
            <circle cx="120" cy="120" r="${R}" fill="none" stroke="var(--arus)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
          </svg>
          <div class="ring-center">
            <div class="kwh">${kwh(s.energyKwh)}<small> kWh</small></div>
            <div class="st">${active?'<span class="pulse"></span>':''}${esc(label)}</div>
          </div>
        </div>
        <div class="livestats">
          <div class="lstat"><div class="v">${s.durationMin}</div><div class="k">menit</div></div>
          <div class="lstat"><div class="v" style="font-size:15px">${s.totalIdr!=null?rp(s.totalIdr):'—'}</div><div class="k">${s.state==='billed'?'Total':'perkiraan'}</div></div>
        </div>
        <div class="card soft small" style="margin-top:14px">
          <div style="display:flex;justify-content:space-between;gap:10px"><span class="muted">${esc(s.siteName)}</span><span>${esc(s.connectorLabel)}</span></div>
          <div class="muted" style="margin-top:4px">Mitra · ${esc(s.operator)}</div>
        </div>
        <div id="sessact" style="margin-top:16px"></div>
      </div>`;
    const act=$('#sessact');
    const stopPoll=()=>{ if(state.poll){clearInterval(state.poll);state.poll=null;} };
    if(s.state==='billed'){
      act.innerHTML=`<button class="cta" id="rdetail">${svg(I.check)} Lihat rincian</button>`;
      $('#rdetail').onclick=()=>go('rreceipt',{cdrId:s.cdrId,_back:()=>go('home')});
      stopPoll();
    } else if(s.state==='rejected'){
      act.innerHTML=`<div class="banner b-warn">${svg(I.warn)}<div><div>${esc(s.problem||'Charger tidak dapat dimulai.')}</div><div>Tempelkan kartu Anda di charger untuk mulai.</div></div></div>
        <button class="cta ghost" id="home" style="margin-top:12px">Kembali ke beranda</button>`;
      $('#home').onclick=()=>go('home');
      stopPoll();
    } else if(s.state==='starting'){
      act.innerHTML=`<div class="banner b-info">${svg(I.info)}<div>Jika charger tidak mulai dalam satu menit, tempelkan kartu Anda di charger.</div></div>`;
    } else if(s.canStop){
      act.innerHTML=`<button class="cta danger" id="stop">${svg(I.stop)} Hentikan pengisian</button>`;
      $('#stop').onclick=async()=>{ if(!confirm(window.tstr('Hentikan pengisian sekarang?')))return;
        $('#stop').innerHTML='<span class="spinner"></span>';
        try{ await api('/v1/roaming/charge/'+id+'/stop',{method:'POST'}); alertBanner('Permintaan berhenti dikirim.'); }
        catch(e){ alertBanner(e.message); paint(s); }
      };
    }
  };
  const tick=async()=>{ const s=await api('/v1/roaming/charge/'+id+'/status'); paint(s); return s; };
  const first=await tick();
  state.poll=setInterval(()=>tick().catch(()=>{}),4000);
  // The operator's bill can take a while; a notification brings the driver back to it.
  if(['starting','charging','finishing'].includes(first.state)){ $('#live').insertAdjacentHTML('afterend','<div id="pushoffer"></div>'); offerPush($('#pushoffer')); }
};

//──────────── SCAN / RESOLVE
async function resolveAndOpen(code){
  try{ const c=await api('/v1/resolve?code='+encodeURIComponent(code)); openConnector(c.connectorId); }
  catch(e){ alertBanner('Kode charger tidak dikenal. Coba pindai ulang atau masukkan kode manual.'); go('home'); }
}
function manualCode(){
  const code=prompt(window.tstr('Masukkan kode charger (mis. AUTEL-DC60-SMB-002:1)'));
  if(code&&code.trim()) resolveAndOpen(code.trim());
}
async function openScanner(){
  document.body.classList.add('tabhide');
  const wrap=el(`<div class="scanview">
    <video playsinline muted></video>
    <div class="scan-top"><button id="sx">Tutup</button></div>
    <div class="scan-overlay"><div class="scan-frame"></div><div class="scan-hint">Arahkan kamera ke kode QR pada charger</div></div>
    <div class="scan-manual"><button class="cta ghost" id="smanual" style="color:#fff;border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.08)">Masukkan kode manual</button></div>
  </div>`);
  document.body.appendChild(wrap);
  const video=$('video',wrap); let stream=null, raf=null, det=null, stop=false;
  const close=()=>{stop=true; if(raf)cancelAnimationFrame(raf); if(stream)stream.getTracks().forEach(t=>t.stop()); wrap.remove(); document.body.classList.remove('tabhide');};
  $('#sx',wrap).onclick=close;
  $('#smanual',wrap).onclick=()=>{close();manualCode();};
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject=stream; await video.play();
    if('BarcodeDetector' in window){
      det=new BarcodeDetector({formats:['qr_code']});
      const tick=async()=>{ if(stop)return;
        try{ const codes=await det.detect(video);
          if(codes&&codes[0]){ const raw=codes[0].rawValue||''; haptic(); close(); handleScanned(raw); return; }
        }catch(e){}
        raf=requestAnimationFrame(tick);
      };
      raf=requestAnimationFrame(tick);
    } else {
      $('.scan-hint',wrap).textContent='Pemindai tidak didukung di perangkat ini. Gunakan kode manual.';
    }
  }catch(e){
    $('.scan-hint',wrap).textContent='Tidak bisa mengakses kamera. Gunakan kode manual.';
  }
}
function handleScanned(raw){
  let code=raw.trim();
  try{ if(/^https?:\/\//i.test(code)){ const u=new URL(code);
    code=u.searchParams.get('code')||u.searchParams.get('c')||u.hash.replace(/^#c\//,'')||u.pathname.split('/').filter(Boolean).pop()||code; } }catch(e){}
  resolveAndOpen(code);
}

//──────────── PAYMENT METHOD (QRIS, e-wallets, card)
const METHOD_UI={QRIS:['QRIS','Pindai QR'],GOPAY:['GoPay','E-wallet'],SHOPEEPAY:['ShopeePay','E-wallet'],OVO:['OVO','E-wallet'],
  DANA:['DANA','E-wallet'],LINKAJA:['LinkAja','E-wallet'],CARD:['Kartu','Kredit / debit']};
/**
 * The operator's payment methods as a picker. One method: nothing to choose.
 * The last choice is remembered on this phone. OVO charges are pushed to the
 * OVO app of a phone number, so it asks for one (the account's by default).
 */
const cardName=(k)=>`${({VISA:'Visa',MASTERCARD:'Mastercard',JCB:'JCB',AMEX:'Amex',GPN:'GPN'})[k.brand]||'Kartu'} ••${esc(k.last4||'')}`;
function methodPicker(box,list,o={}){
  list=list||[];
  const cards=(list.some((m)=>m.channel==='CARD')&&o.savedCards)||[];
  const wallets=o.linkedWallets||[], linkable=o.linkableWallets||[];
  // Choices: linked e-wallets ("WALLET:<id>") and saved cards ("SAVED:<id>") first, then the methods.
  const keys=[...wallets.map((w)=>'WALLET:'+w.id),...cards.map((k)=>'SAVED:'+k.id),...list.map((m)=>m.channel)];
  if(keys.length<=1&&!linkable.length){ box.innerHTML=''; return {value:()=>list[0]?{method:list[0].channel}:{}}; }
  let last=null; try{ last=LS.getItem('ps_method'); }catch(e){}
  // Last paid by card / an e-wallet that has been saved / linked since: that one.
  const linkedFor=(ch)=>wallets.find((w)=>w.channel===ch);
  let cur=last==='CARD'&&cards.length?'SAVED:'+cards[0].id:linkedFor(last)?'WALLET:'+linkedFor(last).id:keys.includes(last)?last:keys[0];
  // Paying another way after an e-wallet failed: do not preselect that e-wallet (it stays on offer).
  const avoided=(k)=>!!o.avoid&&(k===o.avoid||(k.startsWith('WALLET:')&&(wallets.find((w)=>'WALLET:'+w.id===k)||{}).channel===o.avoid));
  if(avoided(cur)) cur=keys.find((k)=>!avoided(k))||cur;
  const phone0=(state.me&&state.me.account&&state.me.account.phone)||'';
  box.innerHTML=`<div class="seclabel" style="margin-top:18px">Bayar dengan</div>
    <div class="methods">${wallets.map((w)=>`<button type="button" class="method" data-ch="WALLET:${esc(w.id)}">${esc((METHOD_UI[w.channel]||[w.channel])[0])} ${esc(w.accountLabel||'')}<small>Terhubung · 1 ketuk</small></button>`).join('')}${cards.map((k)=>`<button type="button" class="method" data-ch="SAVED:${esc(k.id)}">${cardName(k)}<small>Kartu tersimpan</small></button>`).join('')}${list.map((m)=>{ const u=METHOD_UI[m.channel]||[m.label,'']; return `<button type="button" class="method" data-ch="${esc(m.channel)}">${esc(u[0])}<small>${esc(u[1])}</small></button>`; }).join('')}</div>
    <div class="custom-in" id="ovophone" style="display:none"><span>${svg(I.wallet)}</span><input type="tel" inputmode="tel" autocomplete="tel" placeholder="Nomor HP OVO (08…)" value="${esc(phone0.replace(/^\+62/,'0'))}" /></div>
    ${o.canSaveCard?`<label class="savecard" id="savecard" style="display:none"><input type="checkbox" /> <span>Simpan kartu ini untuk pembayaran berikutnya</span></label>`:''}
    ${linkable.length&&o.onLink?`<button type="button" class="linkwallet" id="linkwallet" style="display:none"></button>`:''}
    <div class="small muted" id="methodnote" style="margin-top:8px"></div>`;
  const lw=box.querySelector('#linkwallet');
  if(lw) lw.onclick=async()=>{ haptic(); lw.disabled=true; try{ await o.onLink(cur,box.querySelector('#ovophone input').value.trim()); } finally{ lw.disabled=false; } };
  const holdNote='Kartu Anda hanya ditahan sebesar jumlah yang dipilih. Setelah selesai, yang ditagih hanya biaya pemakaian; sisanya langsung dilepas.';
  const note={QRIS:'Tampilkan QR, lalu pindai dengan aplikasi bank atau e-wallet apa pun.',OVO:'Tagihan dikirim ke aplikasi OVO; setujui di sana.',
    CARD:(o.cardHolds?holdNote+' ':'')+'Anda diarahkan ke halaman kartu yang aman (3-D Secure). Nomor kartu tidak disimpan PlugSure.'};
  const paint=()=>{ box.querySelectorAll('.method').forEach((b)=>b.classList.toggle('sel',b.dataset.ch===cur));
    const canLink=linkable.includes(cur)&&!!lw;
    const ph=box.querySelector('#ovophone'); ph.style.display=cur==='OVO'||canLink?'flex':'none';
    ph.querySelector('input').placeholder=`Nomor HP ${(METHOD_UI[cur]||['OVO'])[0]} (08…)`;
    const sc=box.querySelector('#savecard'); if(sc) sc.style.display=cur==='CARD'?'flex':'none';
    if(lw){ lw.style.display=canLink?'flex':'none'; lw.innerHTML=`${svg(I.wallet)} Hubungkan ${esc((METHOD_UI[cur]||[cur])[0])} untuk bayar satu ketuk`; }
    const wsel=cur.startsWith('WALLET:')?wallets.find((w)=>'WALLET:'+w.id===cur)||{}:null;
    const wname=wsel?(METHOD_UI[wsel.channel]||['e-wallet'])[0]:'';
    const wpost=!!wsel&&!!o.walletPostpay&&wsel.postpay!==false;
    if(o.onChange) setTimeout(()=>o.onChange(cur),0);
    box.querySelector('#methodnote').textContent=cur.startsWith('WALLET:')&&o.walletPostpay&&o.postpayBlocked?'Pembayaran pengisian sebelumnya belum lunas, jadi e-wallet ini ditagih sekarang. Lunasi dari struk sesi itu (Riwayat) untuk kembali bayar setelah selesai.'
      :wsel&&o.walletPostpay&&!wpost?`Saldo ${wname} Anda tidak bisa diperiksa, jadi jumlah ini ditagih sekarang. Sisa saldo yang tidak terpakai dikembalikan otomatis.`
      :wpost?`Tidak ada yang ditagih sekarang. Setelah pengisian selesai, hanya biaya pemakaian yang ditagih dari ${wname} Anda (batas ${rp(o.postpayLimitIdr||0)} per sesi; jumlah lebih besar ditagih di awal).`
      // A reservation fee: exactly that amount.
      :o.fee&&cur.startsWith('WALLET:')?'Ditagih langsung dari e-wallet Anda yang terhubung sebesar biaya reservasi, tanpa membuka aplikasinya.'
      :o.fee&&cur.startsWith('SAVED:')?'Biaya reservasi dibayar dengan kartu tersimpan Anda.'
      // Paying what a finished session cost: exactly that amount, nothing held and nothing refunded.
      :o.settle&&cur.startsWith('WALLET:')?'Ditagih langsung dari e-wallet Anda yang terhubung sebesar tagihan sesi ini, tanpa membuka aplikasinya.'
      :o.settle&&cur.startsWith('SAVED:')?'Dibayar dengan kartu tersimpan Anda sebesar tagihan sesi ini.'
      :o.settle&&cur==='CARD'?'Anda diarahkan ke halaman kartu yang aman (3-D Secure) untuk membayar tagihan sesi ini. Nomor kartu tidak disimpan PlugSure.'
      :cur.startsWith('WALLET:')?'Ditagih langsung dari e-wallet Anda yang terhubung, tanpa membuka aplikasinya. Sisa saldo yang tidak terpakai dikembalikan otomatis.'
      :cur.startsWith('SAVED:')?(o.cardHolds?holdNote:'Dibayar dengan kartu tersimpan Anda.'):note[cur]||`Anda diarahkan ke aplikasi ${(METHOD_UI[cur]||[cur])[0]} untuk membayar.`; };
  box.querySelectorAll('.method').forEach((b)=>b.onclick=()=>{ haptic(); cur=b.dataset.ch; try{ LS.setItem('ps_method',cur.startsWith('WALLET:')?(wallets.find((w)=>'WALLET:'+w.id===cur)||{}).channel:cur); }catch(e){} paint(); });
  paint();
  return {postpay:()=>{ const w=cur.startsWith('WALLET:')?wallets.find((x)=>'WALLET:'+x.id===cur):null; return !!w&&!!o.walletPostpay&&w.postpay!==false&&!o.postpayBlocked; },
    value:()=>cur.startsWith('WALLET:')?{walletId:cur.slice(7)}:cur.startsWith('SAVED:')?{method:'CARD',savedCardId:cur.slice(6)}
    :{method:cur,...(cur==='OVO'?{phone:box.querySelector('#ovophone input').value.trim()}:{}),...(cur==='CARD'&&box.querySelector('#savecard input')&&box.querySelector('#savecard input').checked?{saveCard:true}:{})}};
}

/**
 * Link an e-wallet (GoPay, OVO, DANA) for one-tap payments: the acquirer sends the
 * driver to the e-wallet app to approve; /app/paid.html?for=link brings them back
 * to resumeCheckout(), which checks the link and returns to where they were.
 */
async function startWalletLink(body,back){
  try{
    const r=await api('/v1/wallets',{method:'POST',body:JSON.stringify(body)});
    const name=(METHOD_UI[r.channel]||[r.channel])[0];
    if(r.status==='active'){ alertBanner(name+' terhubung.'); return go(back.view,back.params); }
    try{ LS.setItem('ps_link',JSON.stringify({id:r.id,channel:r.channel,back,at:Date.now()})); }catch(e){}
    if(r.activationUrl){ location.href=r.activationUrl; return; }
    alertBanner('Setujui di aplikasi '+name+', lalu kembali ke sini.');
  }catch(e){ alertBanner(e.message); }
}
async function resumeWalletLink(p){
  try{ LS.removeItem('ps_link'); }catch(e){}
  const name=(METHOD_UI[p.channel]||[p.channel])[0];
  let w=null;
  for(let i=0;i<8;i++){ try{ w=await api('/v1/wallets/'+p.id); }catch(e){ break; } if(w.status!=='pending') break; await new Promise((r)=>setTimeout(r,1500)); }
  alertBanner(w&&w.status==='active'?name+' terhubung. Bayar berikutnya cukup satu ketuk.':w&&w.status==='failed'?name+' tidak jadi dihubungkan.':'Menunggu persetujuan '+name+'. Coba lagi sebentar.');
  go(p.back.view,p.back.params||{});
}

/** An e-wallet / card payment continues outside the app: remember it so the return page can bring the driver back to it. */
function rememberCheckout(view,co){ try{ if(co&&co.payment&&co.payment.action!=='qr') LS.setItem('ps_pending',JSON.stringify({view,co,con:view==='pay'?state._con:null,at:Date.now()})); }catch(e){} }
function forgetCheckout(){ try{ LS.removeItem('ps_pending'); }catch(e){} }
function resumeCheckout(){
  let l=null; try{ l=JSON.parse(LS.getItem('ps_link')||'null'); }catch(e){}
  if(l&&l.id&&Date.now()-l.at<30*60_000){ resumeWalletLink(l); return true; }
  let p=null; try{ p=JSON.parse(LS.getItem('ps_pending')||'null'); }catch(e){}
  if(!p||!p.co||Date.now()-p.at>30*60_000){ forgetCheckout(); return false; }
  if(p.view==='mpay'){ state._mpay=p.co; go('mpay',{_back:()=>go('account')}); }
  else if(p.view==='spay'){ state._spay=p.co; go('spay',{_back:()=>go('receipt',{chargeId:p.co.chargeId,_back:()=>go('home')})}); }
  else if(p.view==='rpay'){ state._rpay=p.co; go('rpay',{_back:()=>go('home')}); }
  else { state._checkout=p.co; state._con=p.con; go('pay',{chargeId:p.co.chargeId,_back:()=>go('home')}); }
  return true;
}

/**
 * E-wallet / card: "Continue to GoPay" (the e-wallet app, or the acquirer's
 * card page), or — OVO — approve the push in the OVO app. Then the same poll
 * as QRIS sees the acquirer's confirmation.
 */
function paintCheckout(v,co,o){
  const p=co.payment, u=METHOD_UI[p.channel]||[p.label,''];
  const push=p.action==='push';
  v.innerHTML=topbar(o.title||('Pembayaran '+u[0]),push?`Setujui di aplikasi ${u[0]}`:(p.channel==='CARD'?'Halaman kartu yang aman (3-D Secure)':`Lanjutkan di aplikasi ${u[0]}`),{back:1})+
    `<div class="paymark">${p.channel==='CARD'?svg(I.card):p.channel==='OVO'||p.method==='ewallet'?svg(I.wallet):esc(u[0])}</div>
     <div class="paylabel"><div class="amt">${rp(o.amountIdr)}</div><div class="qris-badge">${esc(u[0])} · ${p.hold?'Ditahan, bukan ditagih':esc(o.note)}</div></div>
     ${push?`<div class="banner b-info" style="margin-top:18px">${svg(I.info)}<div>Buka aplikasi <b>${esc(u[0])}</b> dan setujui pembayaran ${rp(o.amountIdr)}.</div></div>`:''}
     ${p.checkoutUrl?`<button class="cta" id="gocheckout" style="margin-top:18px">${p.channel==='CARD'?svg(I.card):svg(I.wallet)} ${push?'Buka simulasi '+esc(u[0]):'Lanjutkan ke '+esc(u[0])}</button>`:''}
     <div class="card soft small" style="margin-top:18px;display:flex;gap:10px;align-items:flex-start">${svg(I.info,'')}<div>${o.info?esc(o.info):o.view==='pay'?(p.hold?'Kartu Anda hanya ditahan '+rp(o.amountIdr)+'. Setelah pengisian selesai, yang ditagih hanya biaya pemakaian; sisanya langsung dilepas.':'Setelah membayar, kembali ke sini: charger mulai mengisi sesuai saldo Anda dan berhenti. Sisa saldo yang tidak terpakai dikembalikan ke '+esc(u[0])+'.'):'Setelah membayar, kembali ke sini: langganan langsung aktif.'}${p.saveCard?' Kartu disimpan setelah pembayaran berhasil.':''}</div></div>
     <div id="paywait" style="margin-top:18px"><div class="center-loading" style="padding:16px;gap:12px;flex-direction:column"><span class="spinner"></span><div class="muted small">Menunggu pembayaran…</div></div>
     ${co.demo!==false?'<button class="cta ghost" id="paid" type="button">Simulasikan pembayaran (demo)</button>':''}</div>`;
  const s=$('.card.soft svg',v); if(s) s.style.cssText='width:19px;height:19px;color:var(--arus);flex:none;margin-top:1px';
  // Same tab: an e-wallet deeplink opens its app; the acquirer returns to /app/paid.html, which resumes here.
  if($('#gocheckout')) $('#gocheckout').onclick=()=>{ haptic(); location.href=p.checkoutUrl; };
  let finished=false;
  const finish=()=>{ if(finished) return; finished=true; if(state.poll){clearInterval(state.poll);state.poll=null;} forgetCheckout(); o.onPaid(); };
  if($('#paid')) $('#paid').onclick=async()=>{ $('#paid').innerHTML='<span class="spinner"></span>';
    try{ await api(o.confirmPath,{method:'POST'}); finish(); }catch(e){ alertBanner(e.message); $('#paid').textContent='Simulasikan pembayaran (demo)'; } };
  const check=async()=>{ try{ if(state.view===o.view && await o.isPaid()) finish(); }catch(e){} };
  state.poll=setInterval(check,2500); check();
  const onVisible=()=>{ if(document.visibilityState==='visible'&&state.view===o.view) check(); };
  document.addEventListener('visibilitychange',onVisible);
  const stop=()=>{ if(state.view!==o.view){ document.removeEventListener('visibilitychange',onVisible); window.removeEventListener('hashchange',stop); } };
  window.addEventListener('hashchange',stop);
}

  $('.card.soft svg').style.cssText='width:19px;height:19px;color:var(--arus);flex:none;margin-top:1px';

      }

  };
