<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Charging receipt</title>
<style>
  :root { --bg: #f5f7fa; --panel: #ffffff; --ink: #14202e; --muted: #5d6b7a; --line: #e2e8ef; --ok: #0c7856; --warn: #b26a00; --crit: #b42318; --info: #1b4d8c; --accent: #0c7856; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f141a; --panel: #18202a; --ink: #e8eef5; --muted: #98a6b5; --line: #2a3542; --ok: #3ccf91; --warn: #f0a83a; --crit: #ff6b5e; --info: #7fb2ff; --accent: #3ccf91; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
  header.top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  header.top img { width: 40px; height: 40px; border-radius: 8px; }
  h1 { font-size: 1.4rem; margin: 0; }
  h2 { font-size: 1.05rem; margin: 26px 0 10px; }
  .banner { border-radius: 10px; padding: 14px 16px; font-weight: 600; color: #fff; background: var(--ok); }
  .banner.partial { background: var(--warn); } .banner.major_outage { background: var(--crit); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .site { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .site:first-child { border-top: 0; }
  .site .name { flex: 1; min-width: 0; } .site .name small { display: block; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .st { font-size: .85rem; white-space: nowrap; }
  .operational { color: var(--ok); } .degraded { color: var(--warn); } .outage { color: var(--crit); } .maintenance { color: var(--info); }
  .dot.operational { background: var(--ok); } .dot.degraded { background: var(--warn); } .dot.outage { background: var(--crit); } .dot.maintenance { background: var(--info); }
  .inc { padding: 14px 16px; border-top: 1px solid var(--line); } .inc:first-child { border-top: 0; }
  .inc h3 { margin: 0 0 4px; font-size: 1rem; } .meta { color: var(--muted); font-size: .85rem; }
  .upd { margin-top: 8px; } .upd b { text-transform: capitalize; }
  .muted { color: var(--muted); }
  form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  input[type=email] { flex: 1; min-width: 200px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; }
  button { padding: 9px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  footer { margin-top: 30px; color: var(--muted); font-size: .8rem; }
  .pad { padding: 14px 16px; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .8rem; border-top: 0; }
  td.n, th.n { text-align: right; white-space: nowrap; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: .78rem; border: 1px solid var(--line); }
  .tag.paid { color: var(--ok); } .tag.issued { color: var(--info); } .tag.void { color: var(--muted); }
  select, input[type=text] { padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; min-width: 140px; flex: 1; }
  button.link { background: none; color: var(--crit); padding: 0; font-weight: 500; }
  .scroll { overflow-x: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .kpi { padding: 12px 14px; } .kpi b { display: block; font-size: 1.3rem; } .kpi span { color: var(--muted); font-size: .85rem; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 14px; border-top: 1px solid var(--line); } .row:first-child { border-top: 0; } .row span:first-child { color: var(--muted); }
  #msg { min-height: 1.2em; margin: 8px 0 0; }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script src="/js/terminal-receipt-public.js"></script>
</body>
</html>
