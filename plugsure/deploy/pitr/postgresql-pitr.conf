# PlugSure — continuous WAL archiving for point-in-time recovery (PITR).
#
# Install on the database host (Path B, local PostgreSQL 16; Debian/Ubuntu layout):
#   install -o root -g root -m 0644 deploy/pitr/postgresql-pitr.conf /etc/postgresql/16/main/conf.d/plugsure-pitr.conf
#   install -d -o postgres -g postgres -m 0700 /var/backups/plugsure-pitr /var/backups/plugsure-pitr/wal /var/backups/plugsure-pitr/base
#   systemctl restart postgresql        # archive_mode needs a RESTART (a reload is not enough)
# then check:  sudo -u postgres psql -c "select pg_switch_wal()" && ls /var/backups/plugsure-pitr/wal
#
# The full procedure, the restore and the monthly restore test: deploy/pitr/RESTORE.md.
# Docker Compose (Path A) and RDS: see RESTORE.md §"Other deployments".

# 'replica' is already PostgreSQL 16's default; stated so nobody lowers it to 'minimal'.
wal_level = replica
archive_mode = on
# %p = path of the finished segment (relative to the data directory), %f = its file name.
archive_command = '/opt/plugsure/tools/backup/wal-archive.sh %p %f'
# Force a segment switch at least every 5 minutes when there was any write, so a
# quiet night still archives its last sessions. This bounds data loss on the
# LOCAL archive to 5 minutes; the off-host copy (plugsure-wal-offsite.timer, every
# 5 minutes) bounds a lost host to about 10. A forced switch archives a mostly
# empty 16 MB segment, which wal-archive.sh compresses to a few KB-hundreds of KB.
archive_timeout = 300
# pg_basebackup --wal-method=stream needs a WAL sender (the default 10 is plenty).
max_wal_senders = 10
